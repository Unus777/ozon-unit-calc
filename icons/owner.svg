    <rect x="170" y="0" width="150" height="150" rx="22" fill="url(#tile)" opacity=".88"/>
    <rect x="0" y="170" width="150" height="150" rx="22" fill="url(#tile)" opacity=".88"/>
    <rect x="170" y="170" width="150" height="150" rx="22" fill="#ffd43b"/>
    <!-- знак рубля -->

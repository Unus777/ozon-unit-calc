<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Доставки">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Доставки</title>
<link rel="manifest" href="manifest.webmanifest?v=13">
<script src="theme.js?v=14"></script>
<link rel="stylesheet" href="style.css?v=17">
<link rel="icon" href="icons/courier.svg?v=13" type="image/svg+xml">
<link rel="icon" href="icons/courier-32.png?v=13" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/courier-180.png?v=13" sizes="180x180">
</head>
<body>
<header><div class="bar">
<div class="brand">Алмалы <span>доставки курьера</span></div>
<span><button class="text" id="themeBtn" aria-label="Сменить тему"></button><button class="text" id="reload">Обновить</button></span>
</div></header>
<main>
<div class="card" id="nokey" hidden><h3>Нет доступа</h3><p class="mut">Откройте ссылку, которую прислал владелец магазина.</p></div>

<div id="app" hidden>
<div class="card" id="notif" hidden></div>
<div class="tabs" role="tablist">
<button role="tab" aria-selected="true" data-tab="active">Активные</button>
<button role="tab" aria-selected="false" data-tab="map">Карта</button>
<button role="tab" aria-selected="false" data-tab="done">Доставленные</button>
</div>
<div id="mapbox" hidden><div id="map" role="region" aria-label="Карта доставок"></div><div id="route"></div></div>
<div id="list" class="mut">Загружаю…</div>
</div>

<script src="config.js?v=18"></script>
<script src="push.js?v=15"></script>
<script>
const $ = id => document.getElementById(id);
const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
// ?admin — режим владельца: тот же список, но с правкой всех полей и напоминаниями (ключ владельца из этого браузера)
const ADMIN_KEY = (() => { try { return localStorage.getItem("dlv_admin"); } catch { return null; } })();
const IS_ADMIN = new URLSearchParams(location.search).has("admin") && !!ADMIN_KEY;
const KEY = IS_ADMIN ? ADMIN_KEY : new URLSearchParams(location.search).get("k");
const STATUSES = ["Новый", "Согласован", "Доставлен", "Отменён"];
const FOCUS = new URLSearchParams(location.search).get("o");
const BADGE = {"Новый": "ship", "Согласован": "way", "Доставлен": "done"};
let ROWS = [], PAYS = null, TAB = "active";

const toIso = d => { const m = /^(\d\d)\.(\d\d)\.(\d{4})$/.exec(d || ""); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
const fromIso = d => d ? d.split("-").reverse().join(".") : "";
const rub = x => Math.round(Number(String(x).replace(/\s/g, "")) || 0).toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const api = payload => sheetApi({key: KEY, ...payload});

const dest = r => r.lat && r.lon ? `${r.lat},${r.lon}` : r.address;
// Навигатор по ссылке строит маршрут только с подписью Яндекса, иначе просто открывается — поэтому Яндекс Карты:
// маршрут от текущего места сразу построен, «Поехали» включает ведение
const yandexMaps = r => `https://yandex.ru/maps/?rtext=~${encodeURIComponent(dest(r))}&rtt=auto`;
const appleMaps = r => `https://maps.apple.com/?daddr=${encodeURIComponent(dest(r))}&dirflg=d`;

function card(r) {
  const unloadNone = r.unload === "Нет";
  const done = r.status === "Доставлен";
  const info = deliveryDetails(r.comment);
  let foreman = "";
  try { foreman = foremanPhone(info.foreman); } catch {} // старый некорректный номер не превращаем в ссылку
  // Таблица портит «+»: бывает «7980…» или «=+7980…» — оставляем только цифры
  const digits = String(r.phone || "").replace(/\D/g, "").replace(/^8(?=\d{10}$)/, "7");
  const ext = r.ext ? String(r.ext).replace(/\D/g, "").padStart(4, "0") : "";  // добавочный Ozon — 4 цифры, таблица теряла ведущий ноль
  const tel = digits ? `tel:+${digits}${ext ? "," + ext : ""}` : "";
  return `<div class="card order${r.posting === FOCUS ? " hl" : ""}" data-posting="${e(r.posting)}">
<div class="top"><span class="cb">${e(r.cb)}</span><span class="badge ${BADGE[r.status] || ""}">${e(r.status)}</span>
<span class="mut num">${e(r.posting)}</span></div>
<div class="item"><div><b>${e(r.packs || "—")}</b>${r.unload === "" ? "" : `<span class="unload${unloadNone ? " none" : ""}">${unloadNone ? "Без разгрузки" : "Разгрузка: " + e(r.unload)}</span>`}</div>
<div class="price"><div class="v num">${rub(r.pay)}</div><div class="mut">оплата</div></div></div>
<div class="addr">📍 ${e(r.address)}</div>
${r.date || info.time ? `<div class="delivery-plan">🗓 Доставить: ${e([r.date, info.time].filter(Boolean).join(" · "))}</div>` : ""}
${info.note ? `<div class="delivery-note">💬 ${e(info.note)}</div>` : ""}
<div class="actions">
${tel ? `<a class="btn" href="${e(tel)}">📞 Позвонить</a>` : ""}
${foreman ? `<a class="btn" href="tel:${e(foreman)}">📞 Позвонить прорабу</a>` : ""}
<a class="btn ghost" href="${e(yandexMaps(r))}" target="_blank" rel="noopener">🧭 Яндекс Карты</a>
<a class="btn ghost" href="${e(appleMaps(r))}" target="_blank" rel="noopener">Apple Карты</a>
</div>
${ext ? `<div class="mut" style="margin-top:4px">Добавочный ${e(ext)} наберётся сам после соединения</div>` : ""}
<div class="field"><label for="d-${e(r.posting)}">Дата доставки</label>
<input type="date" id="d-${e(r.posting)}" data-date value="${toIso(r.date)}" ${done ? "disabled" : ""}></div>
<div class="field"><label for="c-${e(r.posting)}">Комментарий</label>
<input id="c-${e(r.posting)}" data-comment value="${e(r.courier_comment)}" placeholder="для владельца" ${done ? "disabled" : ""}></div>
${done ? `<p class="mut">Доставлен${r.delivered_at ? " " + e(r.delivered_at) : ""}</p>` : `<div class="actions"><button data-done>✓ Доставлено</button></div>`}
${IS_ADMIN ? `<div class="actions"><button class="ghost" data-edit>✏️ Изменить</button>${done ? "" : `<button class="ghost" data-remind>🔔 Напомнить</button>`}</div>${editForm(r)}` : ""}
</div>`;
}

function editForm(r) {
  const info = deliveryDetails(r.comment);
  const f = (name, label, value, attrs = "") => `<label class="ef"><span>${label}</span><input name="${name}" value="${e(value)}" ${attrs}></label>`;
  return `<form class="editform" data-editform hidden>
${f("cb", "ЦБ", r.cb)}
<label class="ef"><span>Статус</span><select name="status">${STATUSES.map(s => `<option${s === r.status ? " selected" : ""}>${s}</option>`).join("")}</select></label>
${f("courier", "Курьер", r.courier)}
${f("date", "Дата доставки", toIso(r.date), 'type="date"')}
${f("time", "Время доставки", info.time, 'placeholder="например, 14:00–16:00"')}
<label class="ef wide"><span>Адрес</span><textarea name="address" rows="2">${e(r.address)}</textarea></label>
${f("phone", "Телефон", String(r.phone || "").replace(/^=/, ""), 'inputmode="tel"')}
${f("ext", "Добавочный", r.ext ? String(r.ext).padStart(4, "0") : "", 'inputmode="numeric"')}
${f("foreman", "Телефон прораба", info.foreman, 'inputmode="tel"')}
${f("packs", "Упаковки", r.packs)}
${f("unload", "Разгрузка", r.unload, 'placeholder="Нет / Лифт, эт. 5 / Лестница, эт. 2"')}
${f("delivery", "Доставка, ₽", r.delivery, 'inputmode="numeric"')}
${f("lift", "Подъём, ₽", r.lift, 'inputmode="numeric"')}
<label class="ef wide"><span>Пометка для курьера</span><textarea name="note" rows="2">${e(info.note)}</textarea></label>
<label class="ef wide"><span>Комментарий курьера</span><input name="courier_comment" value="${e(r.courier_comment)}"></label>
<p class="mut wide">${r.lat && r.lon ? "📍 Точка на карте есть" : "📍 Нет точки на карте"} — при смене адреса координаты найдутся заново</p>
<div class="actions wide"><button>Сохранить</button><button type="button" class="ghost" data-cancel>Отмена</button></div>
</form>`;
}

// Координаты по адресу (OpenStreetMap) — чтобы точка на карте и маршрут совпадали с исправленным адресом
async function geocode(address) {
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&q=" + encodeURIComponent(address),
    {headers: {"Accept-Language": "ru"}});
  const [hit] = await r.json();
  return hit ? {lat: (+hit.lat).toFixed(6), lon: (+hit.lon).toFixed(6)} : {lat: "", lon: ""};
}

async function saveEdit(form) {
  const r = ROWS.find(x => x.posting === form.closest(".order").dataset.posting);
  const v = Object.fromEntries(new FormData(form));
  const data = {cb: v.cb.trim(), status: v.status, courier: v.courier.trim(), date: fromIso(v.date), address: v.address.trim(),
    phone: v.phone.trim() ? "+" + v.phone.replace(/\D/g, "").replace(/^8(?=\d{10}$)/, "7") : "", ext: v.ext.replace(/\D/g, ""),
    packs: v.packs.trim(), unload: v.unload.trim(), delivery: v.delivery.replace(/\D/g, "") || "0", lift: v.lift.replace(/\D/g, "") || "0",
    comment: deliveryComment({note: v.note, time: v.time, foreman: v.foreman}), courier_comment: v.courier_comment.trim()};
  if (data.address !== r.address || !(r.lat && r.lon)) Object.assign(data, await geocode(data.address).catch(() => ({lat: "", lon: ""})));
  await save(r.posting, data);
}

function draw() {
  $("mapbox").hidden = TAB !== "map";
  $("list").hidden = TAB === "map";
  if (TAB === "map") { drawMap(); return; }
  const rows = ROWS.filter(r => (r.status === "Доставлен" || r.status === "Отменён") === (TAB === "done"));
  if (TAB === "done") rows.reverse();
  else rows.sort((a, b) => (toIso(a.date) || "9999").localeCompare(toIso(b.date) || "9999"));
  const head = TAB === "done" ? reportHtml(deliveryReport(ROWS, PAYS), IS_ADMIN ? {title: "Расчёт с курьером", leftLabel: "осталось выплатить"} : {title: "Мои выплаты", leftLabel: "вам должны"})
    : IS_ADMIN ? '<div class="card mut">Режим владельца: здесь можно исправить любые данные заказа и отправить курьеру напоминание.</div>' : "";
  $("list").innerHTML = head + (rows.length ? rows.map(card).join("")
    : `<div class="card mut">${TAB === "done" ? "Пока нет доставленных" : "Новых заказов нет"}</div>`);
  if (FOCUS) document.querySelector(".order.hl")?.scrollIntoView({block: "center"});
}

// ---------- карта доставок: виджет Яндекс Карт (без ключа), метки с номерами в порядке объезда ----------
let ME = null, GEO_ASKED = false;
const km = (a, b) => {  // расстояние по прямой, км
  const R = 6371, rad = x => x * Math.PI / 180, dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
// ponytail: порядок объезда «ближайший следующий» по прямой — не учитывает пробки и дороги, для 5–15 точек достаточно
function routeOrder(points, start) {
  const left = [...points], out = [];
  let cur = start || left[0].ll;
  while (left.length) {
    left.sort((a, b) => km(cur, a.ll) - km(cur, b.ll));
    const next = left.shift();
    out.push(next); cur = next.ll;
  }
  return out;
}

function mapView(lls) {  // центр и масштаб, чтобы влезли все точки
  const lats = lls.map(p => p[0]), lons = lls.map(p => p[1]);
  const c = [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lons) + Math.max(...lons)) / 2];
  const span = Math.max(Math.max(...lons) - Math.min(...lons), (Math.max(...lats) - Math.min(...lats)) * 1.8, 0.01);
  return {c, z: Math.max(4, Math.min(15, Math.floor(Math.log2(360 / span)) - 1))};
}

let SEL = null;  // выбранный на карте заказ: маршрут строится только до него

// ---------- официальный JavaScript API Яндекс Карт (с ключом): номера на метках, выбор нажатием, маршрут ----------
let YMAP = null, YROUTE = null;
const loadYmaps = () => window.ymaps ? new Promise(ok => ymaps.ready(ok)) : new Promise((ok, fail) => {
  const js = document.createElement("script");
  js.src = `https://api-maps.yandex.ru/2.1/?lang=ru_RU${YANDEX_MAPS_KEY ? "&apikey=" + encodeURIComponent(YANDEX_MAPS_KEY) : ""}`;
  js.onload = () => ymaps.ready(ok);
  js.onerror = () => fail(new Error("Яндекс Карты не загрузились — проверьте интернет"));
  document.head.appendChild(js);
});

async function drawYmap(order, sel) {
  try { await loadYmaps(); } catch (err) { $("map").innerHTML = `<div class="mut" style="padding:16px">${e(err.message)}</div>`; return; }
  if (!YMAP) {
    $("map").innerHTML = "";
    YMAP = new ymaps.Map("map", {center: [55.75, 37.62], zoom: 9, controls: ["zoomControl", "geolocationControl"]});
  }
  YMAP.geoObjects.removeAll();
  YROUTE = null;
  order.forEach(({r, ll}, i) => {
    const pm = new ymaps.Placemark(ll, {iconContent: String(i + 1), hintContent: `${r.cb} · ${r.packs}`},
      {preset: r.posting === SEL ? "islands#redStretchyIcon" : "islands#blueStretchyIcon"});
    pm.events.add("click", () => { SEL = r.posting === SEL ? null : r.posting; drawMap(); });  // выбор заказа нажатием на метку
    YMAP.geoObjects.add(pm);
  });
  if (ME) YMAP.geoObjects.add(new ymaps.Placemark(ME, {hintContent: "Вы здесь"}, {preset: "islands#geolocationIcon"}));
  if (sel && ME) {  // маршрут по дорогам от курьера до выбранного заказа
    YROUTE = new ymaps.multiRouter.MultiRoute({referencePoints: [ME, sel.ll], params: {routingMode: "auto"}},
      {boundsAutoApply: true, wayPointVisible: false});
    YMAP.geoObjects.add(YROUTE);
    YMAP.setBounds(ymaps.util.bounds.fromPoints([ME, sel.ll]), {checkZoomRange: true, zoomMargin: 40});  // пока маршрут считается
  } else if (sel) {
    YMAP.setCenter(sel.ll, 14, {duration: 300});
  } else if (order.length) {
    const lls = order.map(p => p.ll).concat(ME ? [ME] : []);
    if (lls.length === 1) YMAP.setCenter(lls[0], 13);
    else YMAP.setBounds(ymaps.util.bounds.fromPoints(lls), {checkZoomRange: true, zoomMargin: 40});
  }
}

function drawMap() {
  const active = ROWS.filter(r => r.status === "Новый" || r.status === "Согласован");
  const pts = active.filter(r => r.lat && r.lon).map(r => ({r, ll: [+r.lat, +r.lon]}));
  const noCoords = active.filter(r => !(r.lat && r.lon));
  if (!GEO_ASKED && navigator.geolocation) {
    GEO_ASKED = true;
    navigator.geolocation.getCurrentPosition(p => { ME = [p.coords.latitude, p.coords.longitude]; if (TAB === "map") drawMap(); },
      () => {}, {enableHighAccuracy: true, timeout: 10000});
  }
  if (SEL && !pts.some(p => p.r.posting === SEL)) SEL = null;
  // список: ближайшие к курьеру сверху (без геопозиции — в порядке «ближайший следующий» от первой точки)
  const order = pts.length ? routeOrder(pts, ME) : [];
  const sel = order.find(p => p.r.posting === SEL);
  const useApi = !!(YANDEX_MAPS_KEY || window.FORCE_YMAPS);  // с ключом — полноценная карта, без ключа — виджет
  if (useApi) drawYmap(order, sel);
  let src = "";
  if (useApi) { /* карта нарисована через API */ }
  else if (sel) {  // маршрут только до выбранного заказа
    src = ME ? `https://yandex.ru/map-widget/v1/?rtext=${ME.join(",")}~${sel.ll.join(",")}&rtt=auto`
      : `https://yandex.ru/map-widget/v1/?ll=${sel.ll[1]},${sel.ll[0]}&z=14&pt=${sel.ll[1]},${sel.ll[0]},pm2rdl`;
  } else if (order.length) {  // все точки без маршрута; «вы здесь» — отдельной меткой
    const lls = order.map(p => p.ll).concat(ME ? [ME] : []);
    const v = mapView(lls);
    const marks = order.map(({ll}) => `${ll[1]},${ll[0]},pm2blm`).concat(ME ? [`${ME[1]},${ME[0]},ya_ru`] : []);
    src = `https://yandex.ru/map-widget/v1/?ll=${v.c[1]},${v.c[0]}&z=${v.z}&pt=${marks.join("~")}`;
  }
  if (!useApi && $("map").dataset.src !== src) {
    $("map").dataset.src = src;
    $("map").innerHTML = src ? `<iframe src="${e(src)}" title="Карта доставок" allowfullscreen></iframe>` : "";
  }
  const all = `https://yandex.ru/maps/?rtext=~${order.map(p => p.ll.join(",")).join("~")}&rtt=auto`;
  $("route").innerHTML = !order.length ? `<div class="card mut">Нет активных заказов с точкой на карте</div>` : `
<div class="card"><h3>${sel ? "Маршрут до " + e(sel.r.cb) : "Выберите заказ"}</h3>
<p class="mut">${sel ? "" : (YANDEX_MAPS_KEY ? "Нажмите на метку или на заказ — карта покажет маршрут до него. " : "Нажмите на заказ — карта покажет маршрут до него. ")}${ME ? "Ближайшие к вам — сверху." : "Разрешите геопозицию, чтобы видеть ближайшие и маршрут от вас."}</p>
${sel ? '<div class="actions"><button class="ghost" data-mapall>Показать все точки</button></div>' : ""}
<ol class="stops">${order.map(({r, ll}) => {
    const on = r.posting === SEL;
    return `<li class="stop${on ? " on" : ""}" data-pick="${e(r.posting)}" role="button" tabindex="0" aria-pressed="${on}">` +
      `<b>${e(r.cb)}</b> · ${e(r.packs)} · ${rub(r.pay)}${ME ? ` · ${km(ME, ll).toFixed(1)} км` : ""}` +
      `${r.unload && r.unload !== "Нет" ? `<div class="mut">Разгрузка: ${e(r.unload)}</div>` : ""}<div class="mut">${e(r.address)}</div>` +
      (on ? `<div class="actions"><a class="btn" href="${e(yandexMaps(r))}" target="_blank" rel="noopener">🧭 Поехать</a>` +
        `<a class="btn ghost" href="${e(appleMaps(r))}" target="_blank" rel="noopener">Apple Карты</a></div>` : "") + `</li>`;
  }).join("")}</ol>
${order.length > 1 ? `<div class="actions"><a class="btn ghost" href="${e(all)}" target="_blank" rel="noopener">Маршрут через все точки</a></div>` : ""}</div>
${noCoords.length ? `<div class="card mut">Без точки на карте: ${noCoords.map(r => e(r.cb)).join(", ")}</div>` : ""}`;
}

$("route").addEventListener("click", ev => {
  if (ev.target.closest("a")) return;  // ссылки «Поехать» работают как обычно
  if (ev.target.closest("[data-mapall]")) { SEL = null; drawMap(); return; }
  const li = ev.target.closest("[data-pick]");
  if (!li) return;
  SEL = li.dataset.pick === SEL ? null : li.dataset.pick;
  drawMap();
  $("map").scrollIntoView({behavior: "smooth", block: "start"});
});
$("route").addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-pick]")) { ev.preventDefault(); ev.target.click(); }
});

async function load() {
  try {
    ROWS = await api({action: "list"});
    PAYS = await api({action: "payments"}).catch(() => null);
    draw();
  } catch (err) {
    $("list").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  }
}

async function save(posting, data, el) {
  try {
    const r = await api({action: "update", posting, data});
    ROWS = ROWS.map(x => x.posting === posting ? r : x);
    draw();
  } catch (err) {
    alert(err.message);
    if (el) el.disabled = false;
  }
}

$("list").addEventListener("change", ev => {
  const box = ev.target.closest(".order");
  if (!box) return;
  if (ev.target.matches("[data-date]")) save(box.dataset.posting, {date: fromIso(ev.target.value)});
  if (ev.target.matches("[data-comment]")) save(box.dataset.posting, {courier_comment: ev.target.value.trim()});
});
$("list").addEventListener("submit", async ev => {
  const form = ev.target.closest("[data-editform]");
  if (!form) return;
  ev.preventDefault();
  const btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "Сохраняю…";
  try { await saveEdit(form); } catch (err) { alert(err.message); btn.disabled = false; btn.textContent = "Сохранить"; }
});
$("list").addEventListener("click", ev => {
  const ed = ev.target.closest("[data-edit], [data-cancel]");
  if (ed) { const f = ed.closest(".order").querySelector("[data-editform]"); f.hidden = !f.hidden; return; }
  const rm = ev.target.closest("[data-remind]");
  if (rm) { sendReminder(rm.closest(".order").dataset.posting, KEY).catch(err => alert(err.message)); return; }
  const b = ev.target.closest("[data-done]");
  if (!b) return;
  if (!confirm("Отметить заказ доставленным?")) return;
  b.disabled = true;
  save(b.closest(".order").dataset.posting, {status: "Доставлен"}, b);
});
document.querySelector(".tabs").onclick = ev => {
  const b = ev.target.closest("[data-tab]");
  if (!b) return;
  TAB = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  draw();
};
$("reload").onclick = load;
const themeOrder = ["auto", "light", "dark"];
const drawThemeBtn = () => { $("themeBtn").textContent = "◐ " + THEMES[getTheme()]; };
$("themeBtn").onclick = () => { setTheme(themeOrder[(themeOrder.indexOf(getTheme()) + 1) % 3]); drawThemeBtn(); };
drawThemeBtn();

// ---------- пуш-уведомления ----------
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const b64ToBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

async function subscribe() {
  const reg = await navigator.serviceWorker.register(`sw.js?k=${encodeURIComponent(KEY)}`);
  await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() ||
    await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC)});
  await api({action: "subscribe", endpoint: sub.endpoint});
}

async function setupNotif() {
  const box = $("notif");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    box.hidden = false;
    box.innerHTML = isIOS && !standalone
      ? `<h3>🔔 Включите уведомления</h3><p class="mut">Нажмите «Поделиться» → «На экран „Домой“», откройте «Доставки» с экрана телефона и включите уведомления там.</p>`
      : `<p class="mut">Этот браузер не умеет показывать уведомления. Откройте ссылку в Safari или Chrome.</p>`;
    return;
  }
  if (Notification.permission === "granted") {
    subscribe().catch(() => {});  // подписка могла обновиться — тихо отправляем заново
    return;
  }
  box.hidden = false;
  box.innerHTML = `<h3>🔔 Уведомления о новых заказах</h3>
<p class="mut">Включите, чтобы новый заказ сразу приходил на телефон.</p><button id="enable">Включить уведомления</button>`;
  $("enable").onclick = async () => {
    $("enable").disabled = true;
    try {
      if (await Notification.requestPermission() !== "granted") throw new Error("Уведомления запрещены в настройках телефона");
      await subscribe();
      box.innerHTML = `<p class="green">✓ Уведомления включены</p>`;
    } catch (err) {
      box.innerHTML = `<p class="err">${e(err.message)}</p>`;
    }
  };
}

if (KEY) {
  $("app").hidden = false;
  load();
  if (IS_ADMIN) document.querySelector(".brand span").textContent = "режим владельца";
  else setupNotif();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
} else {
  $("nokey").hidden = false;
}
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Доставки">
<meta name="robots" content="noindex">

<style id="splash-css">/* заставка первой загрузки: стили прямо в странице — видна сразу, до style.css; тема — из theme.js выше */
html{background:#F5F4F0}:root[data-theme="dark"]{background:#0A0D14}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){background:#0A0D14}}
#splash{position:fixed;inset:0;z-index:1500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
background:radial-gradient(90% 60% at 50% 38%,#FFFFFF 0%,#F5F4F0 70%);color:#0B1220;
font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
transition:opacity .45s ease,visibility .45s;padding-bottom:6vh}
:root[data-theme="dark"] #splash{background:radial-gradient(90% 60% at 50% 38%,#151C33 0%,#0A0D14 70%);color:#ECEEF3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash{background:radial-gradient(90% 60% at 50% 38%,#151C33 0%,#0A0D14 70%);color:#ECEEF3}}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash.out .sp-in{transform:scale(1.06)}
.sp-in{display:flex;flex-direction:column;align-items:center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sp-logo{position:relative;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:800;letter-spacing:0;
background:linear-gradient(145deg,#5C7CFA 0%,#3B5BDB 45%,#2A45B8 100%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 34px -10px rgba(59,91,219,.6);animation:sp-breathe 2.2s ease-in-out infinite}
.sp-logo::before,.sp-logo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px rgba(92,124,250,.55);animation:sp-ring 2.2s cubic-bezier(.2,.6,.3,1) infinite;z-index:-1}
.sp-logo::after{animation-delay:1.1s}
.sp-name{margin-top:26px;font-size:22px;font-weight:750;letter-spacing:-.02em}
.sp-sub{margin-top:4px;font-size:14px;color:#7C818B}
.sp-road{position:relative;margin-top:30px;width:168px;height:30px;overflow:hidden}
.sp-road::before{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;border-radius:2px;
background:repeating-linear-gradient(90deg,rgba(124,129,139,.45) 0 10px,transparent 10px 18px);background-size:18px 2px;animation:sp-dash .5s linear infinite}
.sp-truck{position:absolute;bottom:5px;left:0;width:30px;height:22px;color:#3B5BDB;animation:sp-drive 2.4s cubic-bezier(.45,0,.55,1) infinite}
:root[data-theme="dark"] .sp-truck{color:#6F8BFF}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sp-truck{color:#6F8BFF}}
.sp-truck svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:sp-bump .3s ease-in-out infinite alternate}
@keyframes sp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes sp-ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.75);opacity:0}}
@keyframes sp-dash{to{background-position:-18px 0}}
@keyframes sp-drive{0%{transform:translateX(-34px)}50%{transform:translateX(69px)}100%{transform:translateX(172px)}}
@keyframes sp-bump{to{transform:translateY(-1.5px)}}
@media(prefers-reduced-motion:reduce){.sp-logo,.sp-logo::before,.sp-logo::after,.sp-road::before,.sp-truck,.sp-truck svg{animation:none}
.sp-logo::before,.sp-logo::after{display:none}.sp-truck{transform:translateX(69px)}#splash,.sp-in{transition:none}}
</style>
<link rel="stylesheet" href="style.css?v=35">
<link rel="icon" href="icons/courier.svg?v=35" type="image/svg+xml">
<link rel="icon" href="icons/courier-32.png?v=35" sizes="32x32" type="image/png">

</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="Загрузка"><div class="sp-in">
<div class="sp-logo" aria-hidden="true">А</div>
<div class="sp-name">Алмалы Доставка</div><div class="sp-sub">Загружаем доставки…</div>
<div class="sp-road" aria-hidden="true"><div class="sp-truck"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h8A1.5 1.5 0 0 1 14 6.5V16H3zM14 9h3.6a1 1 0 0 1 .8.4l2.4 3.1a1 1 0 0 1 .2.6V16h-7M7.5 18.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM16.5 18.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg></div></div>
</div></div>
<script>setTimeout(function () { if (window.splashHide) splashHide(); else { var s = document.getElementById("splash"); if (s) s.remove(); } }, 10000);  // страховка: заставка не дольше 10 с</script>
<header class="hdr"><div class="bar">
<div class="logo" aria-hidden="true">А</div>
<div class="grow"><div class="brand">Доставки <span id="subtitle">Алмалы</span></div></div>
<button class="ibtn" id="themeBtn" aria-label="Сменить тему"></button><button class="ibtn" id="reload" aria-label="Обновить"></button>
</div></header>
<main style="padding-top:8px">
<div class="card" id="nokey" hidden><h3>Нет доступа</h3><p class="mut">Откройте ссылку, которую прислал владелец магазина.</p></div>

<div id="app" hidden>
<div class="card" id="notif" hidden></div>
<div id="driverHero"></div>
<div id="owed"></div>
<div id="mapbox" hidden>
<div id="map" role="region" aria-label="Карта доставок"></div>
<div class="map-load" id="mapLoad" role="status"><i></i><span>Загружаем карту…</span></div>
<div class="mtop"><div class="mleg" aria-label="Цвета меток"><span><i class="st-n"></i>Новый</span><span><i class="st-g"></i>Согласован</span><span><i class="st-p"></i>ППЗ</span></div>
<div class="mctl"><button type="button" class="mbtn" data-mfit aria-label="Показать все точки" title="Все точки"><span data-ico="fit"></span></button><button type="button" class="mbtn" data-mme aria-label="Где я" title="Где я"><span data-ico="locate"></span></button></div></div>
<div class="mcard" id="mcard" aria-live="polite"></div>
<section class="msheet" id="msheet" data-state="peek" aria-label="Остановки маршрута">
<div class="ms-head" data-mtoggle role="button" tabindex="0" aria-label="Свернуть или развернуть список остановок"><div class="grab"></div>
<div class="ms-row"><div id="msum" class="grow"></div><span class="ms-chev"><span data-ico="chev"></span></span></div>
<a class="btn ms-nav" id="mnav" href="#" target="_blank" rel="noopener" hidden><span data-ico="nav"></span>Весь маршрут в Яндекс Картах</a></div>
<div class="ms-body" id="mlist"></div>
</section>
</div>
<div id="list"></div>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><section class="sheet-panel" role="dialog" aria-modal="true" aria-label="Действия с заказом" id="sheetPanel"></section></div>
<div id="modal-courier-done" class="modal-bg" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-c-title">
    <div class="done-hero"><div class="ico" data-ico="checkc"></div><h3 id="modal-c-title">Подтверждение вручения</h3><div id="modal-c-desc" class="mut" style="margin-top:4px"></div></div>
    <div class="modal-body">
      <label class="chk"><input type="checkbox" id="chk-intact" checked><span>Плитка проверена, битых коробок нет</span></label>
      <label class="chk"><input type="checkbox" id="chk-lift" checked><span id="chk-lift-label">Подъём / разгрузка выполнены полностью</span></label>
      <div class="sum" id="modal-c-sum" style="margin:0"></div>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="modal-c-cancel">Отмена</button>
      <button type="button" class="ok" id="modal-c-confirm">Подтвердить</button>
    </div>
  </div>
</div>
</div>
</main>
<nav class="tabbar" aria-label="Разделы"><div class="in tabs" role="tablist">
<button role="tab" aria-selected="true" data-tab="today"><span data-ico="today"></span>Сегодня</button>
<button role="tab" aria-selected="false" data-tab="active"><span data-ico="orders"></span>Все</button>
<button role="tab" aria-selected="false" data-tab="map"><span data-ico="map"></span>Карта</button>
<button role="tab" aria-selected="false" data-tab="done"><span data-ico="checkc"></span>Готово</button>
</div></nav>

<script src="config.js?v=35"></script>
<script src="push.js?v=35"></script>
<script src="alarm.js?v=35"></script>
<script>
const $ = id => document.getElementById(id);
const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
// ?admin — режим владельца: тот же список, но с правкой всех полей и напоминаниями (ключ владельца из этого браузера)
const ADMIN_KEY = (() => { try { return localStorage.getItem("dlv_admin"); } catch { return null; } })();
const IS_ADMIN = new URLSearchParams(location.search).has("admin") && !!ADMIN_KEY;
const KEY = IS_ADMIN ? ADMIN_KEY : new URLSearchParams(location.search).get("k");
const STATUSES = ["Новый", "Согласован", "Доставлен", "Отменён"];
const FOCUS = new URLSearchParams(location.search).get("o");
const BADGE = {"Новый": "ship", "Согласован": "way", "Доставлен": "done"};
let ROWS = [], PAYS = null, TAB = "today", OPEN = null, SHEET = null;
const todayStr = () => new Date().toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit", year: "numeric"});

const toIso = d => { const m = /^(\d\d)\.(\d\d)\.(\d{4})$/.exec(d || ""); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
const fromIso = d => d ? d.split("-").reverse().join(".") : "";
const rub = x => Math.round(Number(String(x).replace(/\s/g, "")) || 0).toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const api = payload => sheetApi({key: KEY, ...payload});

const dest = r => r.lat && r.lon ? `${r.lat},${r.lon}` : r.address;
// Навигатор по ссылке строит маршрут только с подписью Яндекса, иначе просто открывается — поэтому Яндекс Карты:
// маршрут от текущего места сразу построен, «Поехали» включает ведение
const yandexMaps = r => `https://yandex.ru/maps/?rtext=~${encodeURIComponent(dest(r))}&rtt=auto`;
const appleMaps = r => `https://maps.apple.com/?daddr=${encodeURIComponent(dest(r))}&dirflg=d`;

function telOf(r) {
  // Таблица портит «+»: бывает «7980…» или «=+7980…» — оставляем только цифры
  const digits = String(r.phone || "").replace(/\D/g, "").replace(/^8(?=\d{10}$)/, "7");
  const ext = r.ext ? String(r.ext).replace(/\D/g, "").padStart(4, "0") : "";  // добавочный Ozon — 4 цифры, таблица теряла ведущий ноль
  return {tel: digits ? `tel:+${digits}${ext ? "," + ext : ""}` : "", ext};
}
const unloadText = r => r.unload === "Нет" ? "Без разгрузки" : r.unload ? r.unload : "—";
const whenText = r => { const t = deliveryDetails(r.comment).time || (agreementOf(r) || {}).slot; return [r.date === todayStr() ? "Сегодня" : r.date, t].filter(Boolean).join(" ") || r.status; };
const isPpz = r => /ППЗ|Реутовская/i.test(r.address || "") || /ППЗ/i.test(r.unload || "");

function parsePacksKg(str) {
  let p = 0;
  for (const m of (str || "").matchAll(/(\d+)\s*уп/gi)) p += parseInt(m[1], 10) || 0;
  if (!p) { const n = parseInt(str, 10); if (!isNaN(n)) p = n; }
  return {packs: p, kg: p * 28};
}

function card(r) {
  const done = r.status === "Доставлен" || r.status === "Отменён";
  const ppz = isPpz(r);
  const {kg} = parsePacksKg(r.packs);
  const a = agreementOf(r);
  if (r.posting !== OPEN) {  // свёрнутая строка: нажатие раскрывает
    const mark = ppz ? '<span class="n v">ППЗ</span>' : done ? `<span class="n g">${ic("check", "s")}</span>`
      : a ? `<span class="n g">${ic("calcheck", "s")}</span>` : `<span class="n a">${ic("clock", "s")}</span>`;
    const state = done ? (ppz ? "сдан в ППЗ" : r.status.toLowerCase()) : ppz ? "сдача в ППЗ" : a ? agreedLabel(a).toLowerCase() : "не согласовано";
    return `<button class="crow${r.posting === FOCUS ? " hl" : ""}" data-row="${e(r.posting)}">${mark}` +
      `<span class="crow-main"><b>${e(r.cb)} · ${e(r.packs || "—")}</b>` +
      `<span class="mut">${e(r.address)} · ${e(state)}</span></span>` +
      `<span class="crow-pay num">${rub(r.pay)}</span></button>`;
  }
  const info = deliveryDetails(r.comment), {tel} = telOf(r);
  let foreman = "";
  try { foreman = foremanPhone(info.foreman); } catch {}
  const note = info.note || (r.comment && !info.note && !info.time && !info.foreman ? r.comment : "");
  const badgeTxt = done ? (ppz ? "Сдан в ППЗ" : r.status) : (ppz ? "ППЗ Ozon · " + whenText(r) : whenText(r));
  const agreeRow = done || ppz ? "" : a
    ? `<div class="agree">${ic("checkc")}<span class="tx">Согласовано с ${e(a.who)}ом<small>${a.slot ? "интервал " + e(slotLabel(a.slot)) + " · " : ""}${e(a.day === todayStr().slice(0, 5) ? "сегодня в " + a.time : a.day + " в " + a.time)}</small></span></div>`
    : `<div class="agree no"><span class="dot a"></span>Не согласовано<small>до выезда</small></div>`;
  const calls = [foreman ? `<a class="btn ghost" href="tel:${e(foreman)}" aria-label="Позвонить прорабу">${ic("user")}Прорабу</a>` : "",
    tel ? `<a class="btn ghost" href="${e(tel)}" aria-label="Позвонить клиенту">${ic("phone")}Клиенту</a>` : ""].filter(Boolean);
  if (calls.length === 1) calls[0] = calls[0].replace('class="btn ghost"', 'class="btn ghost full"');
  return `<div class="card order open pt${r.posting === FOCUS ? " hl" : ""}" data-posting="${e(r.posting)}" data-card tabindex="0" aria-haspopup="dialog">
<div class="ph"><div class="r"><span class="badge ${done ? "done" : ppz ? "fbs" : "way plain"}">${done ? ic("check") : ppz ? "" : ic("clock")}${e(badgeTxt)}</span><span class="pay ml">${rub(r.pay)}</span></div>
<div class="addr">${e(r.address)}</div><div class="pn" style="margin-top:4px">${e(r.cb)} · ${e(r.posting)}</div></div>
${agreeRow}
<div class="facts"><div><span>Везти</span><b>${e(r.packs || "—")}</b></div><div><span>Вес</span><b>${kg ? `~${kg} кг` : "—"}</b></div>
<div class="${r.unload && r.unload !== "Нет" && !ppz ? "warn" : ""}"><span>${ppz ? "Сдача" : "Разгрузка"}</span><b>${e(ppz ? "В ППЗ Ozon" : unloadText(r))}</b></div></div>
${note ? `<div class="note">${ic("note")}<span>${e(note)}</span></div>` : ""}
${done ? `<div class="done-line">${ic("checkc")}${ppz ? "Сдан в ППЗ" : "Доставлен"}${r.delivered_at ? " " + e(r.delivered_at) : ""}</div>` : `<div class="pa">
${calls.join("")}
${ppz ? "" : `<button type="button" class="${a ? "soft" : "tint"} full" data-agree="${e(r.posting)}">${ic("calcheck")}${a ? "Изменить согласование" : "Согласовал доставку"}</button>`}
<a class="btn ghost" href="${e(yandexMaps(r))}" target="_blank" rel="noopener">${ic("nav")}Маршрут</a>
<button type="button" class="ok" data-done="${e(r.posting)}">${ic("check")}${ppz ? "Сдал в ППЗ" : "Доставлено"}</button></div>`}
</div>`;
}

// «Согласовал доставку»: с кем, дата и интервал. Пишется строкой «Согласовано: …» в «Комментарий курьера» —
// скрипт таблицы разрешает курьеру только date, status и courier_comment
function openAgreeSheet(posting) {
  const r = ROWS.find(x => x.posting === posting);
  if (!r) return;
  SHEET = null;
  const info = deliveryDetails(r.comment), a = agreementOf(r);
  let foreman = "";
  try { foreman = foremanPhone(info.foreman); } catch {}
  const who = a ? a.who : (foreman ? "прораб" : "клиент");
  const isoL = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const t0 = isoL(new Date()), t1 = isoL(new Date(Date.now() + 864e5));
  const cur = toIso(r.date) || t0;
  const slot = (a && a.slot) || info.time || "";
  const tomorrow = t1.split("-").reverse().slice(0, 2).join(".");
  $("sheetPanel").innerHTML = `<div class="order" data-posting="${e(r.posting)}"><div class="grab"></div>
<div class="shead"><div class="lic b" style="flex:0 0 48px;width:48px;height:48px;border-radius:14px">${ic("calcheck", "l")}</div>
<div><h2>Согласовал доставку</h2><div class="mut trunc">${e(r.cb)} · ${e(r.address)}</div></div></div>
<form data-agreeform>
<div class="fl" style="margin-top:16px">С кем согласовано<div class="seg">${AGREED_WHO.map(w =>
  `<button type="button" data-who="${w}" aria-pressed="${w === who}">${ic(w === "прораб" ? "user" : "phone", "s")}${w[0].toUpperCase() + w.slice(1)}</button>`).join("")}</div></div>
<div class="fl">Дата доставки<div class="seg"><button type="button" data-day="${t0}" aria-pressed="${cur === t0}">Сегодня</button>` +
  `<button type="button" data-day="${t1}" aria-pressed="${cur === t1}">Завтра, ${e(tomorrow)}</button></div>
<input type="date" name="date" value="${cur}" aria-label="Дата доставки"></div>
<div class="fl">Интервал<div class="slots">${DELIVERY_SLOTS.map(x => `<button type="button" data-aslot="${x}" aria-pressed="${x === slot}">${slotLabel(x)}</button>`).join("")}</div>
<input name="slot" value="${e(slot)}" placeholder="или впишите: с 15:30 до 17:00" maxlength="60" aria-label="Интервал"></div>
<div class="sum" style="margin:0">${ic("bell")}<div class="grow" style="font-size:13px;color:var(--ink2)">Владелец увидит «Согласовано · ${e(agreedNow().slice(6))}» и получит уведомление</div></div>
<div class="sdock"><button type="button" class="soft" data-close style="flex:0 0 112px">Отмена</button><button class="f1">${ic("check")}Подтвердить</button></div>
</form></div>`;
  sheetShow();
}

// «⋯» курьера: дата, комментарий, прораб, другие карты; владельцу ещё правка и напоминание
function openCSheet(posting) {
  const r = ROWS.find(x => x.posting === posting);
  if (!r) return;
  SHEET = posting;
  const done = r.status === "Доставлен" || r.status === "Отменён";
  const info = deliveryDetails(r.comment), {tel, ext} = telOf(r);
  let foreman = "";
  try { foreman = foremanPhone(info.foreman); } catch {}  // старый некорректный номер не превращаем в ссылку
  $("sheetPanel").innerHTML = `<div class="order" data-posting="${e(r.posting)}"><div class="grab"></div>
<div class="shead"><div><b>${e(r.cb)} · ${e(r.packs)}</b><div class="mut">${e(r.posting)} · ${e(r.address)}</div></div></div>
${r.status === "Отменён" ? "" : timelineHtml([
  {label: "Заказ получен", when: r.sent, done: true},
  {label: r.date ? `Доставка на ${shortDate(r.date)}` : "Согласовать дату с клиентом", when: info.time, done: !!r.date || done},
  {label: "Доставлен", when: r.delivered_at, done}])}
<div class="sgroup">Доставка</div>
<div class="field"><label for="sd">Дата доставки</label><input type="date" id="sd" data-date value="${toIso(r.date)}" ${done ? "disabled" : ""}></div>
${info.time ? `<div class="sitem">${ic("clock")}Время: ${e(info.time)}</div>` : ""}
${done || isPpz(r) ? "" : `<button class="sitem" data-agree="${e(r.posting)}">${ic("calcheck")}${agreementOf(r) ? e(agreedLabel(agreementOf(r))) + '<span class="mut">изменить</span>' : "Согласовал доставку"}</button>`}
<div class="field"><label for="sc">Комментарий</label><input id="sc" data-comment value="${e(courierNotes(r.courier_comment).text)}" placeholder="для владельца" ${done ? "disabled" : ""}></div>
<div class="sgroup">Связь и маршрут</div>
${tel ? `<a class="sitem" href="${e(tel)}">${ic("phone")}Позвонить клиенту${ext ? `<span class="mut">доб. ${e(ext)} — наберётся сам</span>` : ""}</a>` : ""}
${foreman ? `<a class="sitem" href="tel:${e(foreman)}">${ic("user")}Позвонить прорабу</a>` : ""}
<a class="sitem" href="${e(yandexMaps(r))}" target="_blank" rel="noopener">${ic("nav")}Яндекс Карты</a>

// Координаты по адресу (OpenStreetMap) — чтобы точка на карте и маршрут совпадали с исправленным адресом
async function geocode(address) {
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&q=" + encodeURIComponent(address),
    {headers: {"Accept-Language": "ru"}});
  const [hit] = await r.json();
  return hit ? {lat: (+hit.lat).toFixed(6), lon: (+hit.lon).toFixed(6)} : {lat: "", lon: ""};
}

    packs: v.packs.trim(), unload: v.unload.trim(), delivery: v.delivery.replace(/\D/g, "") || "0", lift: v.lift.replace(/\D/g, "") || "0",

// ---------- карта доставок: MapLibre + векторные плитки OpenFreeMap (бесплатно, без ключа и без рекламы) ----------
// Метки с номерами в порядке объезда и цветом по статусу, нажатие — карточка заказа, маршрут через все точки,
// снизу шторка со списком остановок. Маршрут по дорогам — публичный OSRM; не ответил за 6 с — пунктир по прямой.
let ME = null, ME_ACC = 0, GEO_ASKED = false, SEL = null;

  css: "https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css", cssSri: "sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"};
const km = (a, b) => {  // расстояние по прямой, км

  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
// ponytail: порядок объезда «ближайший следующий» по прямой (от курьера, если известна геопозиция) — для 5–15 точек достаточно
function routeOrder(points, start) {
  const left = [...points], out = [];
  let cur = start || left[0].ll;
  while (left.length) {
    left.sort((a, b) => km(cur, a.ll) - km(cur, b.ll));
    const next = left.shift();
    out.push(next); cur = next.ll;
  }
  return out;
}
const loadLib = () => new Promise((ok, fail) => {
  if (window.maplibregl) return ok();
  const css = Object.assign(document.createElement("link"), {rel: "stylesheet", href: MAPLIBRE.css, integrity: MAPLIBRE.cssSri, crossOrigin: "anonymous"});
  const js = Object.assign(document.createElement("script"), {src: MAPLIBRE.js, integrity: MAPLIBRE.jsSri, crossOrigin: "anonymous"});
  js.onload = ok;
  js.onerror = () => { css.remove(); js.remove(); fail(new Error("Карта не загрузилась — проверьте интернет")); };
  document.head.append(css, js);
});
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
// Стиль OpenFreeMap: светлый Positron / тёмный Dark; подписи — по-русски (name:ru), иначе местное название
const STYLES = {};
const styleName = () => isDark() ? "dark" : "positron";
async function mapStyle(name) {
  if (STYLES[name]) return STYLES[name];
  const s = await (await fetch(`https://tiles.openfreemap.org/styles/${name}`)).json();
  for (const l of s.layers) if (l.layout && l.layout["text-field"]) l.layout["text-field"] = ["coalesce", ["get", "name:ru"], ["get", "name"]];
  s.attribution = "";  // подпись OpenFreeMap убрана с экрана
  for (const src of Object.values(s.sources || {})) if (src && typeof src === "object") src.attribution = "";
  return STYLES[name] = s;
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const stCls = r => isPpz(r) ? "st-p" : r.status === "Согласован" || agreementOf(r) ? "st-g" : "st-n";
const stText = r => isPpz(r) ? "Сдача в ППЗ" : agreementOf(r) ? agreedLabel(agreementOf(r)) : r.status === "Согласован" ? "Согласован" : "Не согласован";
const kmText = m => m >= 10000 ? Math.round(m / 1000) + " км" : (m / 1000).toFixed(1).replace(".", ",") + " км";
const durText = s => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + " мин" : `${Math.floor(m / 60)} ч${m % 60 ? " " + (m % 60) + " мин" : ""}`; };

// Маршрут: точки по порядку (с курьера, если он известен). Кэш по набору точек — опрос раз в минуту не дёргает OSRM.
const ROAD = new Map();  // ключ → {road, line, m, s, legs} | Promise
const llKey = lls => lls.map(p => (+p[0]).toFixed(4) + "," + (+p[1]).toFixed(4)).join(";");
function straight(lls) {  // запасной вариант: по прямой ×1,3 и ~30 км/ч по городу
  const legs = lls.slice(1).map((p, i) => km(lls[i], p) * 1300);
  const m = legs.reduce((a, b) => a + b, 0);
  return {road: false, line: lls, m, s: m / 30000 * 3600, legs};
}
function roadRoute(lls) {
  const key = llKey(lls);
  if (ROAD.has(key)) return ROAD.get(key);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
  const p = fetch(`https://router.project-osrm.org/route/v1/driving/${lls.map(x => `${(+x[1]).toFixed(6)},${(+x[0]).toFixed(6)}`).join(";")}?overview=full&geometries=geojson`,
    {signal: ctl.signal})
    .then(r => r.json()).then(j => {
      const r = j && j.code === "Ok" && j.routes && j.routes[0];
      if (!r) throw new Error("нет маршрута");
      const out = {road: true, line: r.geometry.coordinates.map(c => [c[1], c[0]]), m: r.distance, s: r.duration, legs: r.legs.map(l => l.distance)};
      ROAD.set(key, out);
      return out;
    })
    .catch(() => { ROAD.set(key, straight(lls)); setTimeout(() => ROAD.delete(key), 120000); return ROAD.get(key); })  // через 2 мин попробуем снова
    .finally(() => clearTimeout(timer));
  ROAD.set(key, p);
  return p;
}
function routeInfo(order) {
  const lls = (ME ? [ME] : []).concat(order.map(p => p.ll));
  if (lls.length < 2) return {key: "", lls, data: null};
  const key = llKey(lls), got = ROAD.get(key);
  return {key, lls, data: got && !(got instanceof Promise) ? got : null};

function locate(fly) {
  if (!navigator.geolocation) { if (fly) toast("Геопозиция недоступна в этом браузере", true); return; }
  GEO_ASKED = true;
  navigator.geolocation.getCurrentPosition(p => {
    ME = [p.coords.latitude, p.coords.longitude]; ME_ACC = p.coords.accuracy || 0;
    if (TAB === "map") drawMap();
    if (fly && MAP) MAP.flyTo({center: [ME[1], ME[0]], zoom: Math.max(MAP.getZoom(), 14), duration: 600});
  }, () => { if (fly) toast("Нет доступа к геопозиции — разрешите её в настройках телефона", true); },
  {enableHighAccuracy: true, timeout: 10000, maximumAge: 30000});
}

function initMap() {
  return MAP_P || (MAP_P = (async () => {
    await loadLib();
    MAP_STYLE = styleName();
    const style = await mapStyle(MAP_STYLE);
    MAP = new maplibregl.Map({container: "map", style, center: [37.62, 55.75], zoom: 8.5, attributionControl: false,
      dragRotate: false, pitchWithRotate: false, touchPitch: false, maxPitch: 0, fadeDuration: 150});
    MAP.touchZoomRotate.disableRotation();
    MAP.keyboard.disableRotation();
    MAP.on("style.load", () => { ROUTE_KEY = ""; addRouteLayers(); if (TAB === "map") drawRoute(routeInfo(MAP_ORDER)); });
    MAP.on("click", ev => { if (SEL && !ev.originalEvent.target.closest(".pin")) { SEL = null; drawMap(); } });  // пустая карта закрывает карточку
    await new Promise(ok => MAP.once("load", ok));

}
async function mapTheme() {
  if (!MAP || styleName() === MAP_STYLE) return;

}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", mapTheme);
const circle = (ll, m) => ({type: "Polygon", coordinates: [Array.from({length: 49}, (_, i) => {

let MAP_ORDER = [];
function drawMap() {
  const active = ROWS.filter(r => r.status === "Новый" || r.status === "Согласован");
  const pts = active.filter(r => r.lat && r.lon && isFinite(+r.lat) && isFinite(+r.lon)).map(r => ({r, ll: [+r.lat, +r.lon]}));
  const noCoords = active.filter(r => !pts.some(p => p.r === r));
  if (!GEO_ASKED) locate(false);
  if (SEL && !pts.some(p => p.r.posting === SEL)) SEL = null;
  const order = MAP_ORDER = pts.length ? routeOrder(pts, ME) : [];
  const info = routeInfo(order), d = info.data || (info.key ? straight(info.lls) : null);
  // ---- шторка: сводка и остановки ----
  const off = ME ? 0 : -1;  // legs[0] — от курьера до первой точки, без геопозиции — от первой точки до второй
  const legOf = i => d && d.legs[i + off] != null ? "+" + kmText(d.legs[i + off]) : "";
  const all = `https://yandex.ru/maps/?rtext=~${order.map(p => p.ll.join(",")).join("~")}&rtt=auto`;
  $("msum").innerHTML = `<div class="ms-t"><b>${order.length ? plural(order.length, "точка", "точки", "точек") : "Нет точек"}</b>${d ? ` · ~${kmText(d.m)} · ~${durText(d.s)}` : ""}</div>
<div class="ms-s">${!order.length ? (noCoords.length ? "У заказов в работе нет точки на карте" : "Нет активных заказов") : !d ? "Один адрес" : info.data && info.data.road ? "По дорогам, без учёта пробок" : info.data ? "По прямой — маршрут по дорогам недоступен" : "Считаю маршрут по дорогам…"}${ME ? " · от вас" : ""}</div>`;
  $("mnav").hidden = !order.length;
  $("mnav").href = all;
  const body = $("mlist"), st = body.scrollTop;
  body.innerHTML = (order.length ? `<ol class="mstops">${order.map(({r}, i) => stopHtml(r, i + 1, legOf(i))).join("")}</ol>` : "") +
    (noCoords.length ? `<div class="ms-g">${ic("pin", "s")}Нет точки на карте · ${noCoords.length}</div><ol class="mstops nc">${noCoords.map(r => stopHtml(r, 0, "")).join("")}</ol>` : "") +
    (!order.length && !noCoords.length ? `<div class="ms-empty">${ic("checkc")}Заказов в работе нет</div>` : "");
  body.scrollTop = st;
  // ---- карточка выбранного заказа ----
  const selIdx = order.findIndex(p => p.r.posting === SEL);
  $("mcard").innerHTML = selIdx >= 0 ? mcardHtml(order[selIdx].r, selIdx + 1) : "";
  $("mcard").classList.toggle("show", selIdx >= 0);
  $("msheet").dataset.state = selIdx >= 0 ? "hide" : MS_STATE;
  $("mapbox").style.setProperty("--peek", sheetPeek() + "px");
  // ---- сама карта ----
  if (info.key && !info.data) Promise.resolve(roadRoute(info.lls)).then(() => { if (TAB === "map" && routeInfo(MAP_ORDER).key === info.key) drawMap(); });
  initMap().then(() => {
    $("mapLoad").classList.add("out");
    $("map").querySelector(".map-err")?.remove();
    MAP.resize();
    drawPins(order);
    drawRoute(info);
    const fk = order.map(p => p.r.posting).join() + (ME ? ":me" : "");
    if (fk !== FIT_KEY) { const first = !FIT_KEY; FIT_KEY = fk; fitAll(!first); }
  }).catch(err => {
    $("mapLoad").classList.add("out");
    if (!$("map").querySelector(".map-err")) $("map").insertAdjacentHTML("beforeend", `<div class="map-err">${ic("map", "l")}<b>${e(err.message || "Карта не загрузилась")}</b><span>Список остановок работает и без карты</span></div>`);
  });
}

// шторка остановок: нажатие на шапку — свернуть/развернуть, можно тянуть
function setSheet(s) { MS_STATE = s; $("msheet").dataset.state = s; $("msheet").style.transform = ""; }
(() => {
  const sh = $("msheet"), head = sh.querySelector(".ms-head");
  let y0 = null, dy = 0, moved = false;
  head.addEventListener("touchstart", ev => { if (ev.target.closest("a")) return; y0 = ev.touches[0].clientY; dy = 0; moved = false; }, {passive: true});
  head.addEventListener("touchmove", ev => {
    if (y0 === null) return;
    dy = ev.touches[0].clientY - y0;
    if (Math.abs(dy) > 6) moved = true;
    const base = MS_STATE === "open" ? 0 : sh.offsetHeight - sheetPeek();
    sh.style.transition = "none";
    sh.style.transform = `translateY(${Math.max(0, Math.min(sh.offsetHeight - sheetPeek() + 40, base + dy))}px)`;
  }, {passive: true});
  head.addEventListener("touchend", () => {
    if (y0 === null) return;
    y0 = null; sh.style.transition = "";
    if (moved) { setSheet(dy < -40 ? "open" : dy > 40 ? "peek" : MS_STATE); head.dataset.dragged = "1"; setTimeout(() => delete head.dataset.dragged, 350); }
    else sh.style.transform = "";
  });
})();

$("mapbox").addEventListener("click", ev => {
  if (ev.target.closest("a")) return;  // «Поехать», «Позвонить», Яндекс Карты — обычные ссылки
  const t = ev.target.closest("[data-mpick], [data-mmore], [data-mclose], [data-mtoggle], [data-mfit], [data-mme], [data-maccept]");
  if (!t) return;
  if (t.dataset.mpick) { pickStop(t.dataset.mpick); return; }
  if (t.dataset.mmore) { openCSheet(t.dataset.mmore); return; }
  if (t.hasAttribute("data-mclose")) { SEL = null; drawMap(); return; }
  if (t.hasAttribute("data-mtoggle")) { if (!t.dataset.dragged) setSheet(MS_STATE === "open" ? "peek" : "open"); return; }
  if (t.hasAttribute("data-mfit")) { SEL = null; setSheet("peek"); drawMap(); fitAll(true); return; }
  if (t.hasAttribute("data-mme")) { locate(true); return; }
  if (t.dataset.maccept) {  // тот же «Принял», что на экране тревоги: в телефоне сразу, в таблице — строкой в комментарии курьера
    t.disabled = true;
    acceptOrder(t.dataset.maccept);
    appBadge(ROWS.filter(r => r.status === "Новый" && !isAccepted(r) && !ackGet()[r.posting]).length);
    toast("Принято ✓ Владелец увидит «Принял»");
    drawMap();
  }
});

// ---------- Экран тревоги: новый заказ, пока курьер не нажмёт «Принял» ----------
// «Принял» запоминается в этом телефоне сразу и строкой «Принял: 05.11 14:05» в комментарии курьера —
// владелец видит отметку, скрипт перестаёт повторять пуш. Нет сети — строка допишется при следующей загрузке.
const ACK_KEY = "dlv_ack";
const ackGet = () => { try { return JSON.parse(localStorage.getItem(ACK_KEY) || "{}"); } catch { return {}; } };
const ackSet = v => { try { localStorage.setItem(ACK_KEY, JSON.stringify(v)); } catch {} };
const ACK_SYNC = new Set();
function alarmItem(r) {
  const info = deliveryDetails(r.comment), {kg} = parsePacksKg(r.packs), ppz = isPpz(r);
  const when = [r.date ? (r.date === todayStr() ? "Сегодня" : r.date.slice(0, 5)) : "", info.time].filter(Boolean).join(", ") || "Дата не назначена";
  return {id: r.posting, kicker: ppz ? `Сдача в ППЗ · ${r.cb}` : `Новый заказ · ${r.cb}`, icon: ppz ? "box" : "truck",
    title: r.address || "Адрес уточняется", sub: r.posting,
    chips: [{k: "Везти", v: r.packs || "—"}, {k: "Вес", v: kg ? `~${kg} кг` : "—"},
      {k: "Когда", v: when, warn: !r.date}, {k: ppz ? "Оплата" : "Разгрузка", v: ppz ? rub(r.pay) : unloadText(r), warn: !ppz && r.unload && r.unload !== "Нет"}],
    note: info.note || "", okText: "Принял"};
}
async function sendAck(posting, at) {
  const r = ROWS.find(x => x.posting === posting);
  if (!r || ackOf(r) || ACK_SYNC.has(posting)) return;
  ACK_SYNC.add(posting);
  try {
    const next = await api({action: "update", posting, data: {courier_comment: courierComment({...courierNotes(r.courier_comment), ack: {at}})}});
    ROWS = ROWS.map(x => x.posting === posting ? next : x);
    draw();
  } catch {} finally { ACK_SYNC.delete(posting); }
}
function acceptOrder(posting) {  // «Принял»: в телефоне сразу, в таблице — строкой в комментарии курьера
  const at = agreedNow(), l = ackGet();
  l[posting] = at;
  for (const k of Object.keys(l)) if (!ROWS.some(r => r.posting === k)) delete l[k];  // забываем закрытые заказы
  ackSet(l);
  OPEN = posting;
  return sendAck(posting, at);
}
function appBadge(n) {  // число непринятых заказов на иконке приложения (iOS 16.4+ с экрана «Домой», Android, компьютер)
  try { if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch {}
}
function checkAlerts() {
  if (IS_ADMIN || !KEY) return;
  const local = ackGet();
  for (const r of ROWS) if (local[r.posting] && r.status === "Новый" && !ackOf(r)) sendAck(r.posting, local[r.posting]);  // досылаем
  // «✅ Принял» нажали прямо в уведомлении: …#alert=<номер>&accept=1 — принимаем без экрана тревоги
  const direct = /[#&]accept=1(&|$)/.test(location.hash) ? Alarm.hashId() : null;
  if (direct && ROWS.some(r => r.posting === direct && r.status === "Новый" && !isAccepted(r)) && !local[direct]) {
    acceptOrder(direct);
    toast("Принято ✓ Владелец увидит «Принял»");
  }
  if (direct) history.replaceState(null, "", location.pathname + location.search);
  const acked = ackGet();
  const fresh = ROWS.filter(r => r.status === "Новый" && !isAccepted(r) && !acked[r.posting]);
  appBadge(fresh.length);
  Alarm.show(fresh.map(alarmItem), {replace: true, first: Alarm.hashId(), onAccept: it => {
    const p = acceptOrder(it.id);
    appBadge(Math.max(0, ROWS.filter(r => r.status === "Новый" && !isAccepted(r) && !ackGet()[r.posting]).length));
    return p;
  }});
}
addEventListener("hashchange", () => { if (Alarm.hashId()) load(); });

async function save(posting, data, el) {
  try {
    const r = await api({action: "update", posting, data});
    ROWS = ROWS.map(x => x.posting === posting ? r : x);
    draw();
    if (SHEET === posting) data.status ? closeCSheet() : openCSheet(posting);
    if (data.status === "Доставлен") toast("Доставлено ✓ Владелец получит уведомление");  // меню «⋯» показывает свежие данные
    return true;
  } catch (err) {
    toast(err.message, true);
    if (el) el.disabled = false;
    return false;
  }
}

// ---------- пуш-уведомления ----------
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const b64ToBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

async function subscribe() {
  const reg = await navigator.serviceWorker.register(`sw.js?k=${encodeURIComponent(KEY)}`);
  await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() ||
    await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC)});
  await api({action: "subscribe", endpoint: sub.endpoint});
}

async function setupNotif() {
  const box = $("notif");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    box.hidden = false;
    box.innerHTML = isIOS && !standalone
      ? `<h3>${ic("bell")}Включите уведомления</h3><p class="mut">Нажмите «Поделиться» → «На экран „Домой“», откройте «Доставки» с экрана телефона и включите уведомления там.</p>`
      : `<p class="mut">Этот браузер не умеет показывать уведомления. Откройте ссылку в Safari или Chrome.</p>`;
    return;
  }
  if (Notification.permission === "granted") {
    subscribe().catch(() => {});  // подписка могла обновиться — тихо отправляем заново
    return;
  }
  box.hidden = false;
  box.innerHTML = `<h3>${ic("bell")}Уведомления о новых заказах</h3>
<p class="mut">Включите, чтобы новый заказ сразу приходил на телефон.</p><button id="enable">Включить уведомления</button>`;
  $("enable").onclick = async () => {
    $("enable").disabled = true;
    try {
      if (await Notification.requestPermission() !== "granted") throw new Error("Уведомления запрещены в настройках телефона");
      await subscribe();
      box.innerHTML = `<p class="green">✓ Уведомления включены</p>`;
    } catch (err) {
      box.innerHTML = `<p class="err">${e(err.message)}</p>`;
    }
  };
}

if (KEY) {
  $("app").hidden = false;
  $("driverHero").innerHTML = skelHero();  // пока грузятся данные — скелетоны вместо пустого экрана
  $("list").innerHTML = skelCards(3);
  load();
  if (IS_ADMIN) document.querySelector(".brand span").textContent = "режим владельца";
  else setupNotif();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
} else {
  $("nokey").hidden = false;
  splashHide();
}
pullToRefresh(load);
</script>

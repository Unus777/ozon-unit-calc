<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<header><div class="bar">
<div class="brand">Алмалы <span>заказы Ozon</span></div>
<span class="hbtns"><a class="text" id="dlvLink" href="courier.html?admin=1" hidden>🚚 Доставки</a><button class="text" id="gear" aria-expanded="false" aria-controls="settings">⚙ Настройки</button></span>
</div></header>
<main>

<div class="card settings" id="settings" hidden>
<h3>Тема</h3>
<div class="seg" id="themeSw"></div>
<h3>Доставки курьеру</h3>
<p class="mut" id="dlvState"></p>
<form id="accessForm" style="display:grid;gap:8px">
<input id="accessLink" placeholder="Вставьте вашу ссылку доступа" autocomplete="off" aria-label="Ссылка доступа к доставкам">
<button>Подключить</button>
</form>
<div id="ownerNotif"><h3>Уведомления о курьере</h3>
<p class="mut" id="ownerNotifState">Придут, когда курьер поставит дату, напишет комментарий или нажмёт «Доставлено».</p>
<button class="ghost" id="ownerNotifBtn">🔔 Включить уведомления</button></div>
<div id="forget"><h3>Ozon</h3>
<button class="ghost" id="forgetBtn">Сменить ключи Ozon</button></div>
</div>

<div class="card" id="keys" hidden>
<h3>Ключи Ozon Seller API</h3>
<p class="mut">Вводятся один раз на этом устройстве, хранятся только в его браузере и уходят только на api-seller.ozon.ru.</p>
<form id="keysForm" style="display:grid;gap:8px">
<input id="cid" placeholder="Client-Id" autocomplete="off" inputmode="numeric" aria-label="Client-Id" required>
<input id="key" type="password" placeholder="Api-Key" autocomplete="off" aria-label="Api-Key" required>
<button>Сохранить</button>
</form>
</div>

<div id="app" hidden>
<form class="search" id="calcForm">
<input id="n" placeholder="Номер отправления" autocomplete="off" aria-label="Номер отправления" required>
<button id="go">Рассчитать</button>
</form>
<div id="out"></div>
<div id="report"></div>
<div class="otabs" role="tablist" aria-label="Заказы" id="otabs"></div>
<div id="orders" class="mut"></div>
<p style="text-align:center"><button class="text" id="reload">Обновить список</button></p>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><section class="sheet-panel" role="dialog" aria-modal="true" aria-label="Действия с заказом" id="sheetPanel"></section></div>
</div>

<script src="calc.js?v=12"></script>
<script src="config.js?v=21"></script>
<script src="push.js?v=15"></script>
<script>
const API = "https://api-seller.ozon.ru";
// Статусы Ozon → понятные этапы; неизвестный статус показываем как есть
const STAGES = {
  ship: ["В отгрузке", ["awaiting_registration", "acceptance_in_progress", "awaiting_approve",
    "awaiting_packaging", "awaiting_deliver", "not_accepted"]],
  way: ["В доставке", ["delivering", "driver_pickup", "sent_by_seller"]],
  done: ["Доставлен", ["delivered"]],
  cancel: ["Отменён", ["cancelled"]],
  arb: ["Спор", ["arbitration", "client_arbitration"]],
};
const $ = id => document.getElementById(id);
const e = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const rub = x => Math.round(x).toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const stage = s => Object.entries(STAGES).find(([, [, list]]) => list.includes(s)) || ["", [s]];
const badge = s => { const [cls, [label]] = stage(s); return `<span class="badge ${cls}">${e(label)}</span>`; };

const store = {  // localStorage может быть недоступен (приватный режим) — тогда ключи живут до перезагрузки
  mem: {},
  get(k) { try { return localStorage.getItem(k) ?? this.mem[k]; } catch { return this.mem[k]; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch {} },
};

// Ссылка владельца для доставок: …#admin=<ключ таблицы>&vk=<VAPID JWK в base64url>.
// Приложение с экрана «Домой» на iPhone хранит данные отдельно от Safari, поэтому ссылку
// можно и открыть, и вставить в настройках.
function applyAccess(hash) {
  const h = new URLSearchParams(hash.replace(/^.*?#/, ""));
  if (!h.get("admin") || !h.get("vk")) return false;
  store.set("dlv_admin", h.get("admin"));
  store.set("dlv_vk", h.get("vk"));
  return true;
}
if (applyAccess(location.hash)) history.replaceState(null, "", location.pathname);
const ADMIN = () => store.get("dlv_admin");
let DELIV = {};  // номер отправления → строка листа «Доставки»

async function loadDeliveries() {
  if (!ADMIN() || !SCRIPT_URL) return;
  try {
    DELIV = Object.fromEntries((await sheetApi({action: "list", key: ADMIN()})).map(r => [r.posting, r]));
  } catch { DELIV = {}; }  // таблица недоступна — список заказов всё равно показываем
}

function unloadText(prr) {
  const floor = prr && prr.floor ? `, эт. ${prr.floor}` : "";
  if (!prr || !prr.code || prr.code === "none") return "Нет";  // Ozon шлёт "none", когда подъём не заказан
  return ({lift: "Лифт", stairs: "Лестница"})[prr.code] ? ({lift: "Лифт", stairs: "Лестница"})[prr.code] + floor : prr.code + floor;
}

async function sendToCourier(number, cbRaw, details) {
  const [posting] = await fetchPosting(number);
  const c = posting.customer || {}, a = c.address || {}, prr = posting.prr_option || {};
  const phone = String(c.phone || (posting.addressee || {}).phone || "").replace(/\D/g, "");
  const data = {
    posting: posting.posting_number,
    cb: /^\d+$/.test(cbRaw) ? `ЦБ-${cbRaw}` : cbRaw.toUpperCase().replace(/^ЦБ\s*-?\s*/, "ЦБ-"),
    address: a.address_tail || "", lat: a.latitude || "", lon: a.longitude || "",
    phone: phone ? "+" + phone : "", ext: (posting.addressee || {}).pin || "",
    packs: posting.products.map(p => `${p.quantity} уп ${tileFormat(p.offer_id, p.name) || p.offer_id}`).join(", "),
    unload: unloadText(prr), delivery: parseFloat(posting.delivery_price) || 0, lift: parseFloat(prr.price) || 0,
    date: details.date,
    comment: deliveryComment({...details, note: [a.comment, details.note].filter(Boolean).join("\n")}),
  };
  const jwk = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(store.get("dlv_vk").replace(/-/g, "+").replace(/_/g, "/")), ch => ch.charCodeAt(0))));
  const jwts = {};
  for (const aud of await sheetApi({action: "push_targets", key: ADMIN()})) jwts[aud] = await vapidJwt(aud, jwk);
  return sheetApi({action: "create", key: ADMIN(), data, jwts});
}

function show() {
  const has = store.get("ozon_cid") && store.get("ozon_key");
  $("keys").hidden = !!has;
  $("app").hidden = !has;
  $("forget").hidden = !has;
  if (has) loadOrders();
}

async function ozon(path, payload) {
  const r = await fetch(API + path, {method: "POST", body: JSON.stringify(payload), headers: {
    "Client-Id": store.get("ozon_cid"), "Api-Key": store.get("ozon_key"), "Content-Type": "application/json"}});
  const text = await r.text();
  if (!r.ok) throw new Error(`Ozon ${path}: ${r.status} ${text.slice(0, 200)}`);
  return JSON.parse(text);
}

async function fetchPosting(number) {
  const posting = (await ozon("/v3/posting/fbs/get", {posting_number: number})).result;
  const offers = posting.products.map(p => p.offer_id);
  const items = (await ozon("/v5/product/info/prices",
    {filter: {offer_id: offers, visibility: "ALL"}, limit: 100})).items;
  return [posting, Object.fromEntries(items.map(i => [i.offer_id, i]))];
}

let ORDERS = [], PRICES = {};
const iso = d => d.toISOString().slice(0, 19) + "Z";

async function loadOrders(silent) {
  if (silent !== true) $("orders").innerHTML = '<div class="card skel"></div>'.repeat(3);  // фоновая сверка — без мигания списка
  try {
    const to = new Date(), filter = {since: iso(new Date(to - 90 * 864e5)), to: iso(to)};
    const postings = [];
    let cursor = "";
    do {
      const r = await ozon("/v4/posting/fbs/list", {filter, limit: 100, sort_dir: "DESC", ...(cursor && {cursor})});
      postings.push(...r.postings);
      cursor = r.has_next ? r.cursor : "";
    } while (cursor);
    postings.forEach(p => { p.status = ozStatus(p); });
    const offers = [...new Set(postings.flatMap(p => p.products.map(x => x.offer_id)))];
    const prices = {};
    for (let i = 0; i < offers.length; i += 100) {
      const r = await ozon("/v5/product/info/prices", {filter: {offer_id: offers.slice(i, i + 100), visibility: "ALL"}, limit: 100});
      for (const it of r.items) prices[it.offer_id] = it;
    }
    await loadDeliveries();
    await syncDeliveredFromOzon(postings);
    PAYS = ADMIN() && SCRIPT_URL ? await sheetApi({action: "payments", key: ADMIN()}).catch(() => null) : null;  // null — скрипт ещё без выплат
    drawReport();
    ORDERS = postings; PRICES = prices;
    drawOrders(silent !== true);
  } catch (err) {
    $("orders").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  }
}

// Этап заказа для вкладок: новые (ещё не у курьера) → у курьера → доставлены
function ostate(p) {
  if (p.status === "delivered") return "done";  // в Ozon уже доставлен (с сайта или из кабинета Ozon)
  const d = DELIV[p.posting_number], closed = ["delivered", "cancelled"].includes(p.status);
  // доставлен курьером и отмечен (или уже отправлен) в Ozon — сразу во «Доставлены»
  if (d) return d.status === "Доставлен" && (closed || ozState(p) === "wait") ? "done" : "courier";
  return closed ? "done" : "new";
}
const OTABS = {new: "Новые", courier: "У курьера", done: "Доставлены"};
// Ozon меняет статус на «Доставлено» не сразу — помним отправленные заказы и проверяем, пока не подтвердит
const PENDING_TTL = 2 * 3600e3;
const pendingGet = () => { try { return JSON.parse(localStorage.getItem("oz_pending") || "{}"); } catch { return {}; } };
const pendingSet = v => { try { localStorage.setItem("oz_pending", JSON.stringify(v)); } catch {} };
function ozState(p) {  // "ok" — Ozon провёл; "wait" — ждём; "late" — не подтвердил за 2 часа; "" — не отправляли
  if (p.status === "delivered") return "ok";
  const t = pendingGet()[p.posting_number];
  return !t ? "" : Date.now() - t < PENDING_TTL ? "wait" : "late";
}
const OZ_LINE = {ok: "✅ Отмечено в Ozon",wait: "⏳ Отправлено в Ozon — ждём подтверждения", late: "⚠️ Ozon не подтвердил доставку за 2 часа — проверьте в кабинете"};

// Отметили «Доставлено» прямо в кабинете Ozon — переносим в таблицу, чтобы курьер и расчёт выплат это видели
async function syncDeliveredFromOzon(postings) {
  if (!ADMIN() || !SCRIPT_URL) return;
  const pend = pendingGet();
  for (const p of postings) {
    const d = DELIV[p.posting_number];
    if (p.status === "delivered" && d && d.status !== "Доставлен") {
      try { DELIV[p.posting_number] = await sheetApi({action: "update", key: ADMIN(), posting: p.posting_number, data: {status: "Доставлен"}}); } catch {}
    }
    if (["delivered", "cancelled"].includes(p.status)) delete pend[p.posting_number];
  }
  pendingSet(pend);
}

// Раз в 2 минуты сверяем статусы с Ozon, пока страница открыта и вы ничего не вводите
setInterval(() => {
  const busy = !$("sheet").hidden || document.activeElement?.matches("input, textarea, select");
  if (!document.hidden && !busy && ORDERS.length) loadOrders(true);
}, 120000);

// После отметки продавца rFBS-заказ остаётся «delivering» с подстатусом «условно доставлен» — считаем доставленным
const ozStatus = p => p.substatus === "posting_conditionally_delivered" ? "delivered" : p.status;

async function checkPending() {
  const pend = pendingGet(), nums = Object.keys(pend);
  if (!nums.length || document.hidden) return;
  let changed = false;
  for (const num of nums) {
    try {
      const st = ozStatus((await ozon("/v3/posting/fbs/get", {posting_number: num})).result);
      const p = ORDERS.find(x => x.posting_number === num);
      if (p && p.status !== st) { p.status = st; changed = true; }
      if (st === "delivered" || st === "cancelled") { delete pend[num]; changed = true; }
    } catch {}
  }
  pendingSet(pend);
  if (changed && ORDERS.length) drawOrders();
}
setInterval(checkPending, 30000);
let OTAB = "new";

function drawOrders(anim) {
  const counts = {new: 0, courier: 0, done: 0};
  ORDERS.forEach(p => counts[ostate(p)]++);
  $("otabs").innerHTML = Object.entries(OTABS).map(([k, v]) =>
    `<button role="tab" data-otab="${k}" aria-selected="${OTAB === k}">${v}${k !== "done" && counts[k] ? " · " + counts[k] : ""}</button>`).join("");
  // по порядку: новые сверху, при равной дате — по номеру ЦБ
  const cbNum = p => parseInt(String(DELIV[p.posting_number]?.cb || "").replace(/\D/g, "")) || 0;
  const list = ORDERS.map((p, i) => [p, i]).filter(([p]) => ostate(p) === OTAB)
    .sort(([a], [b]) => new Date(b.in_process_at) - new Date(a.in_process_at) || cbNum(b) - cbNum(a));
  $("orders").classList.toggle("anim", !!anim);  // появление карточек — только при смене вкладки и загрузке, не при фоновой сверке
  $("orders").innerHTML = list.length ? list.map(([p, i], n) => orderCard(p, i, n)).join("")
    : `<div class="card mut">${OTAB === "new" ? "Новых заказов нет" : OTAB === "courier" ? "У курьера сейчас ничего нет" : "Пока пусто"}</div>`;
}

function orderCard(p, i, n = 0) {
  const date = new Date(p.in_process_at).toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
  const d = DELIV[p.posting_number];
  const meta = d ? `${e(d.cb)}${d.date ? " · на " + e(d.date) : ""}` : `${date} · ${e(p.posting_number)}`;
  let items;
  try {
    items = p.products.map(x => {
      const [, t] = calc({...p, products: [x]}, PRICES);
      return `<div class="item"><div><b>${x.quantity} уп · ${tileFormat(x.offer_id, x.name) || e(x.offer_id)}</b>` +
        `<span class="mut">${e(shortName(x.name).replace(/^Керамогранит\s+/i, "").replace(/\s*60\s*[xх×]\s*(60|120)$/i, ""))}</span></div>` +
        `<div class="price"><div class="v num ${t.status[0]}">${Math.round(t.payout_m2)}</div><div class="mut">₽/м² на руки</div></div></div>`;
    }).join("");
  } catch (err) {
    items = `<div class="err">${e(err.message)}</div>`;
  }
  return `<div class="card order${p.status === "cancelled" ? " cancelled" : ""}" data-card="${i}" tabindex="0" aria-haspopup="dialog" style="--i:${Math.min(n, 8)}"><div class="top">` +
    `${d ? courierBadge(p, d) : badge(p.status)}` +
    `<span class="mut num">${meta}</span>` +
    `<span class="chev" aria-hidden="true">›</span></div>${items}${primaryActions(p)}</div>`;
}

// Значок заказа у курьера: у курьера → курьер доставил (ждёт отметки в Ozon) → доставлен
function courierBadge(p, d) {
  if (d.status !== "Доставлен") return '<span class="badge way">У курьера</span>';
  if (p.status === "delivered" || ozState(p) === "wait") return '<span class="badge done">Доставлен</span>';
  return '<span class="badge ship">Курьер доставил</span>';
}

// Главная кнопка по этапу: новый → ЦБ + «Отправить курьеру»; у курьера → «Клиенту» + «Доставлено»;
// курьер доставил → синяя «Отметить доставленным в Ozon»
function primaryActions(p) {
  const d = DELIV[p.posting_number];
  if (!ADMIN() || !SCRIPT_URL) return "";
  if (!d) {
    if (!["ship", "way"].includes(stage(p.status)[0])) return p.status === "delivered" ? `<div class="ozstate ok">${OZ_LINE.ok}</div>` : "";
    return `<form class="send" data-send="${e(p.posting_number)}"><label class="cbfield">ЦБ-<input name="cb" placeholder="970" ` +
      `aria-label="Номер ЦБ" inputmode="numeric" autocomplete="off" required></label><button>Отправить курьеру</button>` +
      `<details class="delivery-edit"><summary>Пометка, время и прораб</summary>${deliveryFields({})}</details></form>`;
  }
  const oz = ozState(p), line = oz ? `<div class="ozstate ${oz}">${OZ_LINE[oz]}</div>` : "";
  const needOzon = !["delivered", "cancelled"].includes(p.status) && oz !== "wait", needSheet = d.status !== "Доставлен";
  if (!needOzon && !needSheet) return line;
  const tel = telHref(d.phone, d.ext);
  return `<div class="actions">${tel && needSheet ? `<a class="btn ghost" href="${e(tel)}">📞 Клиенту</a>` : ""}` +
    `<button class="${needSheet ? "ok" : ""}" data-delivered="${e(p.posting_number)}" data-ozon="${needOzon ? 1 : 0}">` +
    `${needSheet ? "Доставлено" : oz === "late" ? "Повторить в Ozon" : "Отметить доставленным в Ozon"}</button></div>` + line;
}

// Меню «⋯»: все остальные действия, по группам
function openSheet(i) {
  const p = ORDERS[i], d = DELIV[p.posting_number];
  const done = d && d.status === "Доставлен";
  const tel = d ? telHref(d.phone, d.ext) : "";
  const row = (inner) => `<div class="srow">${inner}</div>`;
  const callRow = tel ? `<a class="sitem" href="${e(tel)}">📞 Позвонить клиенту${d.ext ? `<span class="mut">доб. ${e(String(d.ext).padStart(4, "0"))}</span>` : ""}</a>`
    : ["ship", "way"].includes(stage(p.status)[0]) ? `<button class="sitem" data-call="${e(p.posting_number)}">📞 Позвонить клиенту</button>` : "";
  const needOzon = d && !["delivered", "cancelled"].includes(p.status) && ozState(p) !== "wait";
  $("sheetPanel").innerHTML = `<div class="grab"></div>
<div class="shead"><div><b>${d ? e(d.cb) + " · " : ""}${p.products.map(x => x.quantity + " уп").join(" + ")}</b>
<div class="mut">${e(p.posting_number)}${d && d.address ? " · " + e(d.address) : ""}</div></div>${badge(p.status)}</div>
${callRow || (d && !done) ? `<div class="sgroup">Связь</div>${callRow}${d && !done ? `<button class="sitem" data-remind="${e(p.posting_number)}">🔔 Напомнить курьеру</button>` : ""}` : ""}
<div class="sgroup">Заказ</div>
${d && ADMIN() && SCRIPT_URL ? `<details class="sitem-details"><summary class="sitem">✏️ Пометка, время, прораб</summary>` +
  `<form data-schedule="${e(p.posting_number)}">${deliveryFields(d)}<button>Сохранить для Рашада</button></form></details>` : ""}
<button class="sitem" data-open="${e(p.posting_number)}">📊 Расчёт ₽/м²</button>
<button class="sitem" data-copy="${i}">📋 Скопировать для отчёта</button>
${d && (needOzon || !done) && ADMIN() && SCRIPT_URL ? `<button class="ok wide" data-delivered="${e(p.posting_number)}" data-ozon="${needOzon ? 1 : 0}">${done ? "Отметить доставленным в Ozon" : "Доставлено"}</button>` : ""}
<button class="text wide" data-close>Закрыть</button>`;
  sheetShow();
}
const closeSheet = sheetHide;

let PAYS = null;
function drawReport() {
  const open = !!document.querySelector("#report details[open]");
  $("dlvLink").hidden = !(ADMIN() && SCRIPT_URL);
  $("report").innerHTML = ADMIN() && SCRIPT_URL ? reportHtml(deliveryReport(Object.values(DELIV), PAYS),
    {title: "Курьеру осталось выплатить", leftLabel: "", admin: true}) : "";
  if (open) document.querySelector("#report details")?.setAttribute("open", "");
}

$("report").addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-pay]");
  if (!f) return;
  ev.preventDefault();
  const btn = f.querySelector("button");
  btn.disabled = true;
  try {
    const d = f.elements;
    const p = await sheetApi({action: "pay", key: ADMIN(), data: {amount: d.amount.value,
      date: d.date.value ? d.date.value.split("-").reverse().join(".") : "", comment: d.comment.value.trim()}});
    PAYS.push(p);
    drawReport();
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
});
$("report").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-unpay]");
  if (!b || !confirm("Удалить эту выплату?")) return;
  try {
    await sheetApi({action: "unpay", key: ADMIN(), id: b.dataset.unpay});
    PAYS = PAYS.filter(p => p.id !== b.dataset.unpay);
    drawReport();
  } catch (err) { toast(err.message, true); }
});

// tel: с добавочным (Ozon даёт 4 цифры, таблица теряла ведущий ноль) — «,» = пауза, затем добавочный
function telHref(phone, ext) {
  const digits = String(phone || "").replace(/\D/g, "").replace(/^8(?=\d{10}$)/, "7");
  const x = ext ? String(ext).replace(/\D/g, "").padStart(4, "0") : "";
  return digits ? `tel:+${digits}${x ? "," + x : ""}` : "";
}

// «Доставлено» владельцем: Ozon (если там ещё не доставлен) + лист «Доставки» (если курьер ещё не отметил)
async function markDelivered(posting, needOzon) {
  const d = DELIV[posting];
  const where = [needOzon && "в Ozon", d.status !== "Доставлен" && "в таблице"].filter(Boolean).join(" и ");
  if (!confirm(`Отметить ${d.cb} доставленным ${where}?`)) return false;
  if (needOzon) {
    const r = await ozon("/v2/fbs/posting/delivered", {posting_number: [posting]});
    const res = (r.result || []).find(x => x.posting_number === posting) || {};
    if (!res.result) throw new Error("Ozon не принял: " + (res.error || JSON.stringify(r).slice(0, 200)));
    pendingSet(Object.assign(pendingGet(), {[posting]: Date.now()}));
    setTimeout(checkPending, 15000);
  }
  if (d.status !== "Доставлен") DELIV[posting] = await sheetApi({action: "update", key: ADMIN(), posting, data: {status: "Доставлен"}});
  toast(needOzon ? "Отправлено в Ozon ✓ Сайт сам проверит подтверждение" : "Готово ✓");
  return true;
}

function deliveryFields(d) {
  const info = deliveryDetails(d.comment);
  const date = /^(\d\d)\.(\d\d)\.(\d{4})$/.exec(d.date || "");
  return `<div class="delivery-fields">
    <label>Дата доставки<input name="date" type="date" value="${date ? `${date[3]}-${date[2]}-${date[1]}` : ""}"></label>
    <label>Время доставки<input name="time" value="${e(info.time)}" placeholder="Например: с 14:00 до 16:00" maxlength="100"></label>
    <label>Телефон прораба<input name="foreman" type="tel" value="${e(info.foreman)}" placeholder="+7 900 000-00-00" maxlength="30"></label>
    <label>Пометка для Рашада<textarea name="note" rows="3" maxlength="2000" placeholder="Например: позвонить прорабу за час">${e(info.note)}</textarea></label>
    </div>`;
}

function readDeliveryFields(form) {
  const f = form.elements;
  return {date: f.date.value ? f.date.value.split("-").reverse().join(".") : "",
    time: f.time.value.trim(), foreman: foremanPhone(f.foreman.value), note: f.note.value.trim()};
}

function render([lines, t], posting) {
  const goods = lines.map(l => `<tr><td>${e(shortName(l.name))}<div class="mut">${e(l.offer_id)} · ${l.qty} уп · ` +
    `${l.m2.toFixed(2)} м²</div></td><td>${rub(l.price)}<div class="mut">${rub(l.price_m2)}/м²</div></td></tr>`).join("");
  const pcts = [...new Set(lines.map(l => l.pct + "%"))].sort().join(", ");
  const boost = lines.some(l => l.boost) ? "с бустингом" : "без бустинга";
  const [cls, label] = t.status;
  const city = ((posting.customer || {}).address || {}).city;
  return `
<div class="card hero">
<div class="dhead"><span>${badge(posting.status)} <span class="mut num">${e(posting.posting_number)}${city ? " · " + e(city) : ""}</span></span>
<button class="text" id="close" aria-label="Закрыть расчёт">Закрыть</button></div>
<div class="v num ${cls}">${rub(t.payout_m2)}</div>
<div class="mut">на руки за 1 м²</div>
<div class="pill ${cls}">${label} · порог ${t.floor} ₽${t.opt ? " (опт)" : ""}</div>
<div class="kpis">
<div class="kpi"><div class="mut">Прибыль на 1 м²</div><div class="v num">${rub(t.profit_m2)}</div></div>
<div class="kpi"><div class="mut">Прибыль по заказу</div><div class="v num">${rub(t.profit)}</div></div>
</div></div>
<div class="card"><h3>Товар</h3><table>${goods}
<tr class="total"><td>Итого</td><td>${t.packs} уп · ${t.m2.toFixed(2)} м²</td></tr></table></div>
<div class="card"><h3>Расклад</h3><table>
<tr><td>Продажи</td><td>${rub(t.sales)}</td></tr>
<tr><td>Комиссия Ozon ${pcts} <span class="mut">${boost}</span></td><td>−${rub(t.commission)}</td></tr>
<tr><td>Эквайринг 1%</td><td>−${rub(t.acquiring)}</td></tr>
<tr><td>Сбор за отправление</td><td>−${rub(t.fee)}</td></tr>
<tr class="total"><td>На баланс Ozon</td><td>${rub(t.balance)}</td></tr>
<tr><td>НДС к уплате<div class="mut">${rub(t.vat_out)} с продажи − ${rub(t.vat_in_commission)} с комиссии − ${rub(t.vat_in_cost)} с закупки</div></td><td>−${rub(t.vat)}</td></tr>
<tr class="total"><td>На руки</td><td>${rub(t.payout)}</td></tr>
<tr><td>Себестоимость закупки</td><td>−${rub(t.cost)}</td></tr>
<tr class="total"><td>Чистая прибыль</td><td>${rub(t.profit)}</td></tr>
</table></div>
<div class="card"><h3>Логистика от клиента</h3><table>
<tr><td>Доставка</td><td>${rub(t.delivery)}</td></tr>
<tr><td>Подъём <span class="mut">${e(t.lift_note)}</span></td><td>${rub(t.lift)}</td></tr>
<tr class="total"><td>Итого на свою доставку</td><td>${rub(t.delivery + t.lift)}</td></tr>
</table><p class="mut">В ₽/м² не входит. Логистика Ozon 0 ₽ (RealFBS). Комиссия — прогноз по ставке карточки.</p></div>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {  // старый Safari без Clipboard API
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
}

$("keysForm").onsubmit = ev => {
  ev.preventDefault();
  store.set("ozon_cid", $("cid").value.trim());
  store.set("ozon_key", $("key").value.trim());
  $("key").value = "";
  show();
};

$("forgetBtn").onclick = () => {
  store.del("ozon_cid"); store.del("ozon_key"); $("out").innerHTML = ""; $("settings").hidden = true; show();
};

function drawDlvState() {
  drawOwnerNotif();
  $("dlvState").innerHTML = ADMIN() ? '<span class="green">✓ Подключено на этом устройстве</span>'
    : "Не подключено на этом устройстве — вставьте вашу ссылку доступа.";
}
$("gear").onclick = () => {
  const open = $("settings").hidden;
  $("settings").hidden = !open;
  $("gear").setAttribute("aria-expanded", open);
  if (open) { mountThemeSwitch($("themeSw")); drawDlvState(); }
};
$("accessForm").onsubmit = ev => {
  ev.preventDefault();
  if (!applyAccess($("accessLink").value.trim())) { toast("Это не ваша ссылка доступа — скопируйте её целиком", true); return; }
  $("accessLink").value = "";
  drawDlvState();
  if (store.get("ozon_cid")) loadOrders();
};

$("calcForm").onsubmit = async ev => {
  ev.preventDefault();
  const number = $("n").value.trim();
  $("go").disabled = true;
  $("out").innerHTML = '<div class="card mut">Считаю…</div>';
  try {
    const [posting, prices] = await fetchPosting(number);
    $("out").innerHTML = render(calc(posting, prices), posting);
    history.replaceState(null, "", "#" + encodeURIComponent(number));
  } catch (err) {
    $("out").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
};

$("out").onclick = ev => {
  if (ev.target.id !== "close") return;
  $("out").innerHTML = "";
  history.replaceState(null, "", location.pathname);
};

$("app").addEventListener("click", ev => {
  const t = ev.target.closest("[data-otab]");
  if (t) { OTAB = t.dataset.otab; drawOrders(true); return; }
  if (ev.target.closest("[data-close]")) { closeSheet(); return; }
  // нажатие на карточку (не на её кнопку или поле) открывает меню действий
  const c = ev.target.closest("[data-card]");
  if (c && !ev.target.closest("a, button, input, textarea, select, label, summary, form, details")) openSheet(+c.dataset.card);
});
$("app").addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-card]")) { ev.preventDefault(); openSheet(+ev.target.dataset.card); }
});
$("app").addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-copy], button[data-open]");
  if (!b) return;
  if (b.dataset.copy) {
    await copy(copyText(ORDERS[b.dataset.copy], PRICES));
    toast("Скопировано ✓");
  } else if (b.dataset.open) {
    closeSheet();
    $("n").value = b.dataset.open;
    $("calcForm").requestSubmit();
    scrollTo({top: 0, behavior: "smooth"});
  }
});
$("reload").onclick = () => loadOrders();
$("app").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-remind]");
  if (b) sendReminder(b.dataset.remind, ADMIN()).catch(err => toast(err.message, true));
  const cl = ev.target.closest("[data-call]");
  if (cl) {  // заказа ещё нет у курьера: номер берём из Ozon в момент звонка
    cl.disabled = true;
    try {
      const posting = (await ozon("/v3/posting/fbs/get", {posting_number: cl.dataset.call})).result;
      const tel = telHref((posting.customer || {}).phone || (posting.addressee || {}).phone, (posting.addressee || {}).pin);
      if (!tel) throw new Error("Ozon не отдал телефон клиента по этому заказу");
      location.href = tel;
    } catch (err) { toast(err.message, true); }
    cl.disabled = false;
    return;
  }
  const dv = ev.target.closest("[data-delivered]");
  if (!dv) return;
  dv.disabled = true;
  try { if (await markDelivered(dv.dataset.delivered, dv.dataset.ozon === "1")) { closeSheet(); loadOrders(); } }
  catch (err) { toast(err.message, true); }
  dv.disabled = false;
});

// ---------- уведомления владельцу о действиях курьера ----------
const pushReady = () => "serviceWorker" in navigator && "PushManager" in window;
async function ownerSubscribe() {
  const reg = await navigator.serviceWorker.register(`sw.js?k=${encodeURIComponent(ADMIN())}`);
  await navigator.serviceWorker.ready;
  const raw = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: raw});
  await sheetApi({action: "subscribe", key: ADMIN(), endpoint: sub.endpoint});
}
function drawOwnerNotif() {
  $("ownerNotif").hidden = !(ADMIN() && SCRIPT_URL);
  const on = pushReady() && Notification.permission === "granted";
  $("ownerNotifBtn").hidden = on || !pushReady();
  $("ownerNotifState").innerHTML = on ? '<span class="green">✓ Включены на этом устройстве</span>'
    : pushReady() ? "Придут, когда курьер поставит дату, напишет комментарий или нажмёт «Доставлено»."
    : "На iPhone откройте сайт с экрана «Домой» (Поделиться → На экран «Домой»), тогда уведомления можно будет включить.";
}
$("ownerNotifBtn").onclick = async () => {
  $("ownerNotifBtn").disabled = true;
  try {
    if (await Notification.requestPermission() !== "granted") throw new Error("Уведомления запрещены в настройках телефона");
    await ownerSubscribe();
  } catch (err) { toast(err.message, true); }
  $("ownerNotifBtn").disabled = false;
  drawOwnerNotif();
};
if (ADMIN() && SCRIPT_URL && pushReady() && Notification.permission === "granted") ownerSubscribe().catch(() => {});  // подписка могла обновиться

$("app").addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-send], form[data-schedule]");
  if (!f) return;
  ev.preventDefault();
  const btn = f.querySelector("button"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Сохраняю…";
  try {
    const details = readDeliveryFields(f);
    const r = f.dataset.schedule
      ? await sheetApi({action: "update", key: ADMIN(), posting: f.dataset.schedule,
          data: {date: details.date, comment: deliveryComment(details)}})
      : await sendToCourier(f.dataset.send, f.elements.cb.value.trim(), details);
    DELIV[r.posting] = r;
    if (f.dataset.schedule) {
      btn.disabled = false; btn.textContent = "Сохранено ✓";
      setTimeout(() => { btn.textContent = label; }, 2000);
    } else {
      toast(r.pushed ? "Отправлено Рашаду ✓" : "Заказ у курьера, но пуш не дошёл: курьер не включил уведомления", !r.pushed);
      drawOrders();
    }
  } catch (err) {
    btn.disabled = false; btn.textContent = label;
    toast(err.message, true);
  }
});

show();
if (location.hash.length > 1) $("n").value = decodeURIComponent(location.hash.slice(1));
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Юнит-экономика</title>
<link rel="manifest" href="owner.webmanifest?v=12">
<meta name="apple-mobile-web-app-title" content="Алмалы">
<script src="theme.js?v=12"></script>
<link rel="stylesheet" href="style.css?v=12">
<link rel="icon" href="icons/app.svg?v=12" type="image/svg+xml">
<link rel="icon" href="icons/app-32.png?v=12" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=12" sizes="180x180">
</head>
<body>
<header><div class="bar">
<div class="brand">Алмалы <span>юнит-экономика заказов Ozon</span></div>
<button class="text" id="gear" aria-expanded="false" aria-controls="settings">⚙ Настройки</button>
</div></header>
<main>

<div class="card settings" id="settings" hidden>
<h3>Тема</h3>
<div class="seg" id="themeSw"></div>
<h3>Доставки курьеру</h3>
<p class="mut" id="dlvState"></p>
<form id="accessForm" style="display:grid;gap:8px">
<input id="accessLink" placeholder="Вставьте вашу ссылку доступа" autocomplete="off" aria-label="Ссылка доступа к доставкам">
<button>Подключить</button>
</form>
<div id="forget"><h3>Ozon</h3>
<button class="ghost" id="forgetBtn">Сменить ключи Ozon</button></div>
</div>

<div class="card" id="keys" hidden>
<h3>Ключи Ozon Seller API</h3>
<p class="mut">Вводятся один раз на этом устройстве, хранятся только в его браузере и уходят только на api-seller.ozon.ru.</p>
<form id="keysForm" style="display:grid;gap:8px">
<input id="cid" placeholder="Client-Id" autocomplete="off" inputmode="numeric" aria-label="Client-Id" required>
<input id="key" type="password" placeholder="Api-Key" autocomplete="off" aria-label="Api-Key" required>
<button>Сохранить</button>
</form>
</div>

<div id="app" hidden>
<form class="search" id="calcForm">
<input id="n" placeholder="Номер отправления" autocomplete="off" aria-label="Номер отправления" required>
<button id="go">Рассчитать</button>
</form>
<div id="out"></div>
<div id="report"></div>
<div class="label">Заказы <button class="text" id="reload">Обновить</button></div>
<div id="orders" class="mut"></div>
</div>

<script src="calc.js?v=12"></script>
<script src="config.js?v=12"></script>
<script src="push.js?v=12"></script>
<script>
const API = "https://api-seller.ozon.ru";
// Статусы Ozon → понятные этапы; неизвестный статус показываем как есть
const STAGES = {
  ship: ["В отгрузке", ["awaiting_registration", "acceptance_in_progress", "awaiting_approve",
    "awaiting_packaging", "awaiting_deliver", "not_accepted"]],
  way: ["В доставке", ["delivering", "driver_pickup", "sent_by_seller"]],
  done: ["Доставлен", ["delivered"]],
  cancel: ["Отменён", ["cancelled"]],
  arb: ["Спор", ["arbitration", "client_arbitration"]],
};
const $ = id => document.getElementById(id);
const e = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const rub = x => Math.round(x).toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const stage = s => Object.entries(STAGES).find(([, [, list]]) => list.includes(s)) || ["", [s]];
const badge = s => { const [cls, [label]] = stage(s); return `<span class="badge ${cls}">${e(label)}</span>`; };

const store = {  // localStorage может быть недоступен (приватный режим) — тогда ключи живут до перезагрузки
  mem: {},
  get(k) { try { return localStorage.getItem(k) ?? this.mem[k]; } catch { return this.mem[k]; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch {} },
};

// Ссылка владельца для доставок: …#admin=<ключ таблицы>&vk=<VAPID JWK в base64url>.
// Приложение с экрана «Домой» на iPhone хранит данные отдельно от Safari, поэтому ссылку
// можно и открыть, и вставить в настройках.
function applyAccess(hash) {
  const h = new URLSearchParams(hash.replace(/^.*?#/, ""));
  if (!h.get("admin") || !h.get("vk")) return false;
  store.set("dlv_admin", h.get("admin"));
  store.set("dlv_vk", h.get("vk"));
  return true;
}
if (applyAccess(location.hash)) history.replaceState(null, "", location.pathname);
const ADMIN = () => store.get("dlv_admin");
let DELIV = {};  // номер отправления → строка листа «Доставки»

async function loadDeliveries() {
  if (!ADMIN() || !SCRIPT_URL) return;
  try {
    DELIV = Object.fromEntries((await sheetApi({action: "list", key: ADMIN()})).map(r => [r.posting, r]));
  } catch { DELIV = {}; }  // таблица недоступна — список заказов всё равно показываем
}

function unloadText(prr) {
  const floor = prr && prr.floor ? `, эт. ${prr.floor}` : "";
  if (!prr || !prr.code || prr.code === "none") return "Нет";  // Ozon шлёт "none", когда подъём не заказан
  return ({lift: "Лифт", stairs: "Лестница"})[prr.code] ? ({lift: "Лифт", stairs: "Лестница"})[prr.code] + floor : prr.code + floor;
}

async function sendToCourier(number, cbRaw, details) {
  const [posting] = await fetchPosting(number);
  const c = posting.customer || {}, a = c.address || {}, prr = posting.prr_option || {};
  const phone = String(c.phone || (posting.addressee || {}).phone || "").replace(/\D/g, "");
  const data = {
    posting: posting.posting_number,
    cb: /^\d+$/.test(cbRaw) ? `ЦБ-${cbRaw}` : cbRaw.toUpperCase().replace(/^ЦБ\s*-?\s*/, "ЦБ-"),
    address: a.address_tail || "", lat: a.latitude || "", lon: a.longitude || "",
    phone: phone ? "+" + phone : "", ext: (posting.addressee || {}).pin || "",
    packs: posting.products.map(p => `${p.quantity} уп ${tileFormat(p.offer_id, p.name) || p.offer_id}`).join(", "),
    unload: unloadText(prr), delivery: parseFloat(posting.delivery_price) || 0, lift: parseFloat(prr.price) || 0,
    date: details.date,
    comment: deliveryComment({...details, note: [a.comment, details.note].filter(Boolean).join("\n")}),
  };
  const jwk = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(store.get("dlv_vk").replace(/-/g, "+").replace(/_/g, "/")), ch => ch.charCodeAt(0))));
  const jwts = {};
  for (const aud of await sheetApi({action: "push_targets", key: ADMIN()})) jwts[aud] = await vapidJwt(aud, jwk);
  return sheetApi({action: "create", key: ADMIN(), data, jwts});
}

function show() {
  const has = store.get("ozon_cid") && store.get("ozon_key");
  $("keys").hidden = !!has;
  $("app").hidden = !has;
  $("forget").hidden = !has;
  if (has) loadOrders();
}

async function ozon(path, payload) {
  const r = await fetch(API + path, {method: "POST", body: JSON.stringify(payload), headers: {
    "Client-Id": store.get("ozon_cid"), "Api-Key": store.get("ozon_key"), "Content-Type": "application/json"}});
  const text = await r.text();
  if (!r.ok) throw new Error(`Ozon ${path}: ${r.status} ${text.slice(0, 200)}`);
  return JSON.parse(text);
}

async function fetchPosting(number) {
  const posting = (await ozon("/v3/posting/fbs/get", {posting_number: number})).result;
  const offers = posting.products.map(p => p.offer_id);
  const items = (await ozon("/v5/product/info/prices",
    {filter: {offer_id: offers, visibility: "ALL"}, limit: 100})).items;
  return [posting, Object.fromEntries(items.map(i => [i.offer_id, i]))];
}

let ORDERS = [], PRICES = {};
const iso = d => d.toISOString().slice(0, 19) + "Z";

async function loadOrders() {
  $("orders").textContent = "Загружаю…";
  try {
    const to = new Date(), filter = {since: iso(new Date(to - 90 * 864e5)), to: iso(to)};
    const postings = [];
    let cursor = "";
    do {
      const r = await ozon("/v4/posting/fbs/list", {filter, limit: 100, sort_dir: "DESC", ...(cursor && {cursor})});
      postings.push(...r.postings);
      cursor = r.has_next ? r.cursor : "";
    } while (cursor);
    const offers = [...new Set(postings.flatMap(p => p.products.map(x => x.offer_id)))];
    const prices = {};
    for (let i = 0; i < offers.length; i += 100) {
      const r = await ozon("/v5/product/info/prices", {filter: {offer_id: offers.slice(i, i + 100), visibility: "ALL"}, limit: 100});
      for (const it of r.items) prices[it.offer_id] = it;
    }
    await loadDeliveries();
    PAYS = ADMIN() && SCRIPT_URL ? await sheetApi({action: "payments", key: ADMIN()}).catch(() => null) : null;  // null — скрипт ещё без выплат
    drawReport();
    ORDERS = postings; PRICES = prices;
    $("orders").innerHTML = postings.length ? postings.map(orderCard).join("") : '<div class="card mut">Заказов нет</div>';
  } catch (err) {
    $("orders").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  }
}

function orderCard(p, i) {
  const date = new Date(p.in_process_at).toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
  let body;
  try {
    body = p.products.map(x => {
      const [, t] = calc({...p, products: [x]}, PRICES);
      return `<div class="item"><div><b>${x.quantity} уп · ${e(x.offer_id)}</b><span class="mut">${e(shortName(x.name))}</span></div>` +
        `<div class="price"><div class="v num ${t.status[0]}">${Math.round(t.payout_m2)}</div><div class="mut">₽/м² на руки</div></div></div>`;
    }).join("") + `<div class="actions"><button data-copy="${i}">Скопировать</button>` +
      `<button class="ghost" data-open="${e(p.posting_number)}">Подробно</button></div>`;
  } catch (err) {
    body = `<div class="err">${e(err.message)}</div>`;
  }
  body += courierBlock(p);
  return `<div class="card order${p.status === "cancelled" ? " cancelled" : ""}"><div class="top">${badge(p.status)}` +
    `<span class="mut num">${date} · ${e(p.posting_number)}</span></div>${body}</div>`;
}

let PAYS = null;
function drawReport() {
  const open = !!document.querySelector("#report details[open]");
  $("report").innerHTML = ADMIN() && SCRIPT_URL ? reportHtml(deliveryReport(Object.values(DELIV), PAYS),
    {title: "Расчёт с курьером", leftLabel: "осталось выплатить", admin: true}) : "";
  if (open) document.querySelector("#report details")?.setAttribute("open", "");
}

$("report").addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-pay]");
  if (!f) return;
  ev.preventDefault();
  const btn = f.querySelector("button");
  btn.disabled = true;
  try {
    const d = f.elements;
    const p = await sheetApi({action: "pay", key: ADMIN(), data: {amount: d.amount.value,
      date: d.date.value ? d.date.value.split("-").reverse().join(".") : "", comment: d.comment.value.trim()}});
    PAYS.push(p);
    drawReport();
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
  }
});
$("report").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-unpay]");
  if (!b || !confirm("Удалить эту выплату?")) return;
  try {
    await sheetApi({action: "unpay", key: ADMIN(), id: b.dataset.unpay});
    PAYS = PAYS.filter(p => p.id !== b.dataset.unpay);
    drawReport();
  } catch (err) { alert(err.message); }
});

function courierBlock(p) {
  const d = DELIV[p.posting_number];
  if (d) {
    const done = d.status === "Доставлен";
    return `<div class="courier ${done ? "green" : ""}">${done ? "✅ Курьер доставил" : "🚚 У курьера"} · ${e(d.cb)} · ` +
      `${e(done ? d.delivered_at : d.status + (d.date ? " на " + d.date : ""))}</div>` +
      (ADMIN() && SCRIPT_URL ? `<details class="delivery-edit"><summary>Пометка, время и прораб</summary>` +
        `<form data-schedule="${e(p.posting_number)}">${deliveryFields(d)}<button>Сохранить для Рашада</button></form></details>` : "");
  }
  if (!ADMIN() || !SCRIPT_URL || !["ship", "way"].includes(stage(p.status)[0])) return "";
  return `<form class="send" data-send="${e(p.posting_number)}"><input name="cb" placeholder="ЦБ" aria-label="Номер ЦБ" ` +
    `inputmode="numeric" autocomplete="off" required><details class="delivery-edit"><summary>Пометка, время и прораб</summary>` +
    `${deliveryFields({})}</details><button>Отправить курьеру</button></form>`;
}

function deliveryFields(d) {
  const info = deliveryDetails(d.comment);
  const date = /^(\d\d)\.(\d\d)\.(\d{4})$/.exec(d.date || "");
  return `<div class="delivery-fields">
    <label>Дата доставки<input name="date" type="date" value="${date ? `${date[3]}-${date[2]}-${date[1]}` : ""}"></label>
    <label>Время доставки<input name="time" value="${e(info.time)}" placeholder="Например: с 14:00 до 16:00" maxlength="100"></label>
    <label>Телефон прораба<input name="foreman" type="tel" value="${e(info.foreman)}" placeholder="+7 900 000-00-00" maxlength="30"></label>
    <label>Пометка для Рашада<textarea name="note" rows="3" maxlength="2000" placeholder="Например: позвонить прорабу за час">${e(info.note)}</textarea></label>
    </div>`;
}

function readDeliveryFields(form) {
  const f = form.elements;
  return {date: f.date.value ? f.date.value.split("-").reverse().join(".") : "",
    time: f.time.value.trim(), foreman: foremanPhone(f.foreman.value), note: f.note.value.trim()};
}

function render([lines, t], posting) {
  const goods = lines.map(l => `<tr><td>${e(shortName(l.name))}<div class="mut">${e(l.offer_id)} · ${l.qty} уп · ` +
    `${l.m2.toFixed(2)} м²</div></td><td>${rub(l.price)}<div class="mut">${rub(l.price_m2)}/м²</div></td></tr>`).join("");
  const pcts = [...new Set(lines.map(l => l.pct + "%"))].sort().join(", ");
  const boost = lines.some(l => l.boost) ? "с бустингом" : "без бустинга";
  const [cls, label] = t.status;
  const city = ((posting.customer || {}).address || {}).city;
  return `
<div class="card hero">
<div class="dhead"><span>${badge(posting.status)} <span class="mut num">${e(posting.posting_number)}${city ? " · " + e(city) : ""}</span></span>
<button class="text" id="close" aria-label="Закрыть расчёт">Закрыть</button></div>
<div class="v num ${cls}">${rub(t.payout_m2)}</div>
<div class="mut">на руки за 1 м²</div>
<div class="pill ${cls}">${label} · порог ${t.floor} ₽${t.opt ? " (опт)" : ""}</div>
<div class="kpis">
<div class="kpi"><div class="mut">Прибыль на 1 м²</div><div class="v num">${rub(t.profit_m2)}</div></div>
<div class="kpi"><div class="mut">Прибыль по заказу</div><div class="v num">${rub(t.profit)}</div></div>
</div></div>
<div class="card"><h3>Товар</h3><table>${goods}
<tr class="total"><td>Итого</td><td>${t.packs} уп · ${t.m2.toFixed(2)} м²</td></tr></table></div>
<div class="card"><h3>Расклад</h3><table>
<tr><td>Продажи</td><td>${rub(t.sales)}</td></tr>
<tr><td>Комиссия Ozon ${pcts} <span class="mut">${boost}</span></td><td>−${rub(t.commission)}</td></tr>
<tr><td>Эквайринг 1%</td><td>−${rub(t.acquiring)}</td></tr>
<tr><td>Сбор за отправление</td><td>−${rub(t.fee)}</td></tr>
<tr class="total"><td>На баланс Ozon</td><td>${rub(t.balance)}</td></tr>
<tr><td>НДС к уплате<div class="mut">${rub(t.vat_out)} с продажи − ${rub(t.vat_in_commission)} с комиссии − ${rub(t.vat_in_cost)} с закупки</div></td><td>−${rub(t.vat)}</td></tr>
<tr class="total"><td>На руки</td><td>${rub(t.payout)}</td></tr>
<tr><td>Себестоимость закупки</td><td>−${rub(t.cost)}</td></tr>
<tr class="total"><td>Чистая прибыль</td><td>${rub(t.profit)}</td></tr>
</table></div>
<div class="card"><h3>Логистика от клиента</h3><table>
<tr><td>Доставка</td><td>${rub(t.delivery)}</td></tr>
<tr><td>Подъём <span class="mut">${e(t.lift_note)}</span></td><td>${rub(t.lift)}</td></tr>
<tr class="total"><td>Итого на свою доставку</td><td>${rub(t.delivery + t.lift)}</td></tr>
</table><p class="mut">В ₽/м² не входит. Логистика Ozon 0 ₽ (RealFBS). Комиссия — прогноз по ставке карточки.</p></div>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {  // старый Safari без Clipboard API
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
}

$("keysForm").onsubmit = ev => {
  ev.preventDefault();
  store.set("ozon_cid", $("cid").value.trim());
  store.set("ozon_key", $("key").value.trim());
  $("key").value = "";
  show();
};

$("forgetBtn").onclick = () => {
  store.del("ozon_cid"); store.del("ozon_key"); $("out").innerHTML = ""; $("settings").hidden = true; show();
};

function drawDlvState() {
  $("dlvState").innerHTML = ADMIN() ? '<span class="green">✓ Подключено на этом устройстве</span>'
    : "Не подключено на этом устройстве — вставьте вашу ссылку доступа.";
}
$("gear").onclick = () => {
  const open = $("settings").hidden;
  $("settings").hidden = !open;
  $("gear").setAttribute("aria-expanded", open);
  if (open) { mountThemeSwitch($("themeSw")); drawDlvState(); }
};
$("accessForm").onsubmit = ev => {
  ev.preventDefault();
  if (!applyAccess($("accessLink").value.trim())) { alert("Это не ваша ссылка доступа — скопируйте её целиком"); return; }
  $("accessLink").value = "";
  drawDlvState();
  if (store.get("ozon_cid")) loadOrders();
};

$("calcForm").onsubmit = async ev => {
  ev.preventDefault();
  const number = $("n").value.trim();
  $("go").disabled = true;
  $("out").innerHTML = '<div class="card mut">Считаю…</div>';
  try {
    const [posting, prices] = await fetchPosting(number);
    $("out").innerHTML = render(calc(posting, prices), posting);
    history.replaceState(null, "", "#" + encodeURIComponent(number));
  } catch (err) {
    $("out").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
};

$("out").onclick = ev => {
  if (ev.target.id !== "close") return;
  $("out").innerHTML = "";
  history.replaceState(null, "", location.pathname);
};

$("orders").onclick = async ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.copy) {
    await copy(copyText(ORDERS[b.dataset.copy], PRICES));
    b.textContent = "Скопировано ✓";
    setTimeout(() => { b.textContent = "Скопировать"; }, 1500);
  } else if (b.dataset.open) {
    $("n").value = b.dataset.open;
    $("calcForm").requestSubmit();
    scrollTo({top: 0, behavior: "smooth"});
  }
};
$("reload").onclick = loadOrders;

$("orders").addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-send], form[data-schedule]");
  if (!f) return;
  ev.preventDefault();
  const btn = f.querySelector("button"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Сохраняю…";
  try {
    const details = readDeliveryFields(f);
    const r = f.dataset.schedule
      ? await sheetApi({action: "update", key: ADMIN(), posting: f.dataset.schedule,
          data: {date: details.date, comment: deliveryComment(details)}})
      : await sendToCourier(f.dataset.send, f.elements.cb.value.trim(), details);
    DELIV[r.posting] = r;
    if (f.dataset.schedule) {
      btn.disabled = false; btn.textContent = "Сохранено ✓";
      setTimeout(() => { btn.textContent = label; }, 2000);
    } else {
      f.outerHTML = courierBlock({posting_number: r.posting}) +
        (r.pushed ? "" : '<p class="mut">Пуш не дошёл: курьер не включил уведомления. Заказ сохранён.</p>');
    }
  } catch (err) {
    btn.disabled = false; btn.textContent = label;
    alert(err.message);
  }
});

show();
if (location.hash.length > 1) $("n").value = decodeURIComponent(location.hash.slice(1));
</script>
</main></body>
</html>

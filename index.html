<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Юнит-экономика</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--fg:#14161a;--mut:#6b7079;--line:#e3e5e9;--soft:#f6f7f9;
--acc:#3b5bdb;--acc-fg:#fff;--green:#2b8a3e;--yellow:#b06f00;--red:#c92a2a;
--green-bg:#ebfbee;--yellow-bg:#fff8e6;--red-bg:#fff0f0;--acc-bg:#edf2ff;--shadow:0 1px 2px rgba(20,22,26,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1012;--card:#1a1c20;--fg:#eceef2;--mut:#9097a3;--line:#2a2d33;
--soft:#212429;--acc:#748ffc;--acc-fg:#0f1012;--green:#69db7c;--yellow:#ffc94d;--red:#ff8787;
--green-bg:#1b2b1f;--yellow-bg:#2e2716;--red-bg:#2f1c1c;--acc-bg:#1e2440;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.bar{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;color:var(--mut);font-weight:500;font-size:13px;letter-spacing:0}
header button.text{white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.search{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;
background:var(--card);color:var(--fg);outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
button{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border:0;border-radius:12px;background:var(--acc);
color:var(--acc-fg);cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:var(--soft);color:var(--fg)}
button.text{background:none;color:var(--mut);font-weight:500;font-size:14px;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.label{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:24px 4px 8px;
display:flex;justify-content:space-between;align-items:center}
.label button{text-transform:none;letter-spacing:0}
.mut{color:var(--mut);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.err{color:var(--red)}
[hidden]{display:none!important}

.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut)}
.badge.ship{background:var(--yellow-bg);color:var(--yellow)}.badge.way{background:var(--acc-bg);color:var(--acc)}
.badge.done{background:var(--green-bg);color:var(--green)}

.order.cancelled{opacity:.55}
.order .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.order .top .mut{margin-left:auto;font-size:13px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item+.item{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.item b{display:block;font-size:16px}
.price{text-align:right;white-space:nowrap}
.price .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;font-size:15px;padding:10px 12px}

.hero{text-align:center;padding:24px 16px}
.hero .v{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pill{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}
.pill.green{background:var(--green-bg)}.pill.yellow{background:var(--yellow-bg)}.pill.red{background:var(--red-bg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.kpi{background:var(--soft);border-radius:12px;padding:12px;text-align:left}
.kpi .v{font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse}
td{padding:8px 0;vertical-align:top;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
tr.total td{font-weight:700}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h3{margin:0;font-size:15px}
</style>
</head>
<body>
<header><div class="bar">
<div class="brand">Алмалы <span>юнит-экономика заказов Ozon</span></div>
<button class="text" id="forget" hidden>Сменить ключи</button>
</div></header>
<main>

<div class="card" id="keys" hidden>
<h3>Ключи Ozon Seller API</h3>
<p class="mut">Вводятся один раз на этом устройстве, хранятся только в его браузере и уходят только на api-seller.ozon.ru.</p>
<form id="keysForm" style="display:grid;gap:8px">
<input id="cid" placeholder="Client-Id" autocomplete="off" inputmode="numeric" aria-label="Client-Id" required>
<input id="key" type="password" placeholder="Api-Key" autocomplete="off" aria-label="Api-Key" required>
<button>Сохранить</button>
</form>
</div>

<div id="app" hidden>
<form class="search" id="calcForm">
<input id="n" placeholder="Номер отправления" autocomplete="off" aria-label="Номер отправления" required>
<button id="go">Рассчитать</button>
</form>
<div id="out"></div>
<div class="label">Заказы <button class="text" id="reload">Обновить</button></div>
<div id="orders" class="mut"></div>
</div>

<script src="calc.js"></script>
<script>
const API = "https://api-seller.ozon.ru";
// Статусы Ozon → понятные этапы; неизвестный статус показываем как есть
const STAGES = {
  ship: ["В отгрузке", ["awaiting_registration", "acceptance_in_progress", "awaiting_approve",
    "awaiting_packaging", "awaiting_deliver", "not_accepted"]],
  way: ["В доставке", ["delivering", "driver_pickup", "sent_by_seller"]],
  done: ["Доставлен", ["delivered"]],
  cancel: ["Отменён", ["cancelled"]],
  arb: ["Спор", ["arbitration", "client_arbitration"]],
};
const $ = id => document.getElementById(id);
const e = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const rub = x => Math.round(x).toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const stage = s => Object.entries(STAGES).find(([, [, list]]) => list.includes(s)) || ["", [s]];
const badge = s => { const [cls, [label]] = stage(s); return `<span class="badge ${cls}">${e(label)}</span>`; };

const store = {  // localStorage может быть недоступен (приватный режим) — тогда ключи живут до перезагрузки
  mem: {},
  get(k) { try { return localStorage.getItem(k) ?? this.mem[k]; } catch { return this.mem[k]; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch {} },
};

function show() {
  const has = store.get("ozon_cid") && store.get("ozon_key");
  $("keys").hidden = !!has;
  $("app").hidden = !has;
  $("forget").hidden = !has;
  if (has) loadOrders();
}

async function ozon(path, payload) {
  const r = await fetch(API + path, {method: "POST", body: JSON.stringify(payload), headers: {
    "Client-Id": store.get("ozon_cid"), "Api-Key": store.get("ozon_key"), "Content-Type": "application/json"}});
  const text = await r.text();
  if (!r.ok) throw new Error(`Ozon ${path}: ${r.status} ${text.slice(0, 200)}`);
  return JSON.parse(text);
}

async function fetchPosting(number) {
  const posting = (await ozon("/v3/posting/fbs/get", {posting_number: number})).result;
  const offers = posting.products.map(p => p.offer_id);
  const items = (await ozon("/v5/product/info/prices",
    {filter: {offer_id: offers, visibility: "ALL"}, limit: 100})).items;
  return [posting, Object.fromEntries(items.map(i => [i.offer_id, i]))];
}

let ORDERS = [], PRICES = {};
const iso = d => d.toISOString().slice(0, 19) + "Z";

async function loadOrders() {
  $("orders").textContent = "Загружаю…";
  try {
    const to = new Date(), filter = {since: iso(new Date(to - 90 * 864e5)), to: iso(to)};
    const postings = [];
    let cursor = "";
    do {
      const r = await ozon("/v4/posting/fbs/list", {filter, limit: 100, sort_dir: "DESC", ...(cursor && {cursor})});
      postings.push(...r.postings);
      cursor = r.has_next ? r.cursor : "";
    } while (cursor);
    const offers = [...new Set(postings.flatMap(p => p.products.map(x => x.offer_id)))];
    const prices = {};
    for (let i = 0; i < offers.length; i += 100) {
      const r = await ozon("/v5/product/info/prices", {filter: {offer_id: offers.slice(i, i + 100), visibility: "ALL"}, limit: 100});
      for (const it of r.items) prices[it.offer_id] = it;
    }
    ORDERS = postings; PRICES = prices;
    $("orders").innerHTML = postings.length ? postings.map(orderCard).join("") : '<div class="card mut">Заказов нет</div>';
  } catch (err) {
    $("orders").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  }
}

function orderCard(p, i) {
  const date = new Date(p.in_process_at).toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
  let body;
  try {
    body = p.products.map(x => {
      const [, t] = calc({...p, products: [x]}, PRICES);
      return `<div class="item"><div><b>${x.quantity} уп · ${e(x.offer_id)}</b><span class="mut">${e(shortName(x.name))}</span></div>` +
        `<div class="price"><div class="v num ${t.status[0]}">${Math.round(t.payout_m2)}</div><div class="mut">₽/м² на руки</div></div></div>`;
    }).join("") + `<div class="actions"><button data-copy="${i}">Скопировать</button>` +
      `<button class="ghost" data-open="${e(p.posting_number)}">Подробно</button></div>`;
  } catch (err) {
    body = `<div class="err">${e(err.message)}</div>`;
  }
  return `<div class="card order${p.status === "cancelled" ? " cancelled" : ""}"><div class="top">${badge(p.status)}` +
    `<span class="mut num">${date} · ${e(p.posting_number)}</span></div>${body}</div>`;
}

function render([lines, t], posting) {
  const goods = lines.map(l => `<tr><td>${e(shortName(l.name))}<div class="mut">${e(l.offer_id)} · ${l.qty} уп · ` +
    `${l.m2.toFixed(2)} м²</div></td><td>${rub(l.price)}<div class="mut">${rub(l.price_m2)}/м²</div></td></tr>`).join("");
  const pcts = [...new Set(lines.map(l => l.pct + "%"))].sort().join(", ");
  const boost = lines.some(l => l.boost) ? "с бустингом" : "без бустинга";
  const [cls, label] = t.status;
  const city = ((posting.customer || {}).address || {}).city;
  return `
<div class="card hero">
<div class="dhead"><span>${badge(posting.status)} <span class="mut num">${e(posting.posting_number)}${city ? " · " + e(city) : ""}</span></span>
<button class="text" id="close" aria-label="Закрыть расчёт">Закрыть</button></div>
<div class="v num ${cls}">${rub(t.payout_m2)}</div>
<div class="mut">на руки за 1 м²</div>
<div class="pill ${cls}">${label} · порог ${t.floor} ₽${t.opt ? " (опт)" : ""}</div>
<div class="kpis">
<div class="kpi"><div class="mut">Прибыль на 1 м²</div><div class="v num">${rub(t.profit_m2)}</div></div>
<div class="kpi"><div class="mut">Прибыль по заказу</div><div class="v num">${rub(t.profit)}</div></div>
</div></div>
<div class="card"><h3>Товар</h3><table>${goods}
<tr class="total"><td>Итого</td><td>${t.packs} уп · ${t.m2.toFixed(2)} м²</td></tr></table></div>
<div class="card"><h3>Расклад</h3><table>
<tr><td>Продажи</td><td>${rub(t.sales)}</td></tr>
<tr><td>Комиссия Ozon ${pcts} <span class="mut">${boost}</span></td><td>−${rub(t.commission)}</td></tr>
<tr><td>Эквайринг 1%</td><td>−${rub(t.acquiring)}</td></tr>
<tr><td>Сбор за отправление</td><td>−${rub(t.fee)}</td></tr>
<tr class="total"><td>На баланс Ozon</td><td>${rub(t.balance)}</td></tr>
<tr><td>НДС к уплате<div class="mut">${rub(t.vat_out)} с продажи − ${rub(t.vat_in_commission)} с комиссии − ${rub(t.vat_in_cost)} с закупки</div></td><td>−${rub(t.vat)}</td></tr>
<tr class="total"><td>На руки</td><td>${rub(t.payout)}</td></tr>
<tr><td>Себестоимость закупки</td><td>−${rub(t.cost)}</td></tr>
<tr class="total"><td>Чистая прибыль</td><td>${rub(t.profit)}</td></tr>
</table></div>
<div class="card"><h3>Логистика от клиента</h3><table>
<tr><td>Доставка</td><td>${rub(t.delivery)}</td></tr>
<tr><td>Подъём <span class="mut">${e(t.lift_note)}</span></td><td>${rub(t.lift)}</td></tr>
<tr class="total"><td>Итого на свою доставку</td><td>${rub(t.delivery + t.lift)}</td></tr>
</table><p class="mut">В ₽/м² не входит. Логистика Ozon 0 ₽ (RealFBS). Комиссия — прогноз по ставке карточки.</p></div>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {  // старый Safari без Clipboard API
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
}

$("keysForm").onsubmit = ev => {
  ev.preventDefault();
  store.set("ozon_cid", $("cid").value.trim());
  store.set("ozon_key", $("key").value.trim());
  $("key").value = "";
  show();
};

$("forget").onclick = () => { store.del("ozon_cid"); store.del("ozon_key"); $("out").innerHTML = ""; show(); };

$("calcForm").onsubmit = async ev => {
  ev.preventDefault();
  const number = $("n").value.trim();
  $("go").disabled = true;
  $("out").innerHTML = '<div class="card mut">Считаю…</div>';
  try {
    const [posting, prices] = await fetchPosting(number);
    $("out").innerHTML = render(calc(posting, prices), posting);
    history.replaceState(null, "", "#" + encodeURIComponent(number));
  } catch (err) {
    $("out").innerHTML = `<div class="card err">${e(err.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
};

$("out").onclick = ev => {
  if (ev.target.id !== "close") return;
  $("out").innerHTML = "";
  history.replaceState(null, "", location.pathname);
};

$("orders").onclick = async ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.copy) {
    await copy(copyText(ORDERS[b.dataset.copy], PRICES));
    b.textContent = "Скопировано ✓";
    setTimeout(() => { b.textContent = "Скопировать"; }, 1500);
  } else if (b.dataset.open) {
    $("n").value = b.dataset.open;
    $("calcForm").requestSubmit();
    scrollTo({top: 0, behavior: "smooth"});
  }
};
$("reload").onclick = loadOrders;

show();
if (location.hash.length > 1) $("n").value = decodeURIComponent(location.hash.slice(1));
</script>
</main></body>
</html>

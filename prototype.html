<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)">
<title>Алмалы · трекер</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="ribbon" id="ribbon" role="status">Прототип · в таблицу и Ozon ничего не отправляется</div>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">А</span>
    <div><strong>Алмалы</strong><span id="fresh">обновлено только что</span></div>
  </div>
  <div class="top-a">
    <button type="button" class="icon" id="searchBtn" aria-label="Поиск" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button type="button" class="icon" id="themeBtn" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    <button type="button" class="icon" id="reloadBtn" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></svg></button>
    <button type="button" class="who" id="whoBtn">
      <span class="ava" id="whoAva">Р</span>
      <span class="who-t"><b>Рашад</b><small id="whoSeen">нет данных</small></span>
    </button>
  </div>
</header>
<form class="search" id="searchRow" role="search" hidden>
  <input id="q" type="search" placeholder="ЦБ, адрес, имя, телефон" aria-label="Найти заказ" autocomplete="off" enterkeyhint="search">
</form>
<div class="desk">
  <div class="col">
    <div class="sticky" id="sticky"></div>
    <main id="stage"></main>
  </div>
  <aside class="mapwrap" id="mapWrap">
    <button type="button" class="maphandle" id="mapToggle" aria-expanded="true"><i></i><span id="mapHandleText">Карта сегодня</span></button>
    <div class="mapframe">
      <div id="map" role="region" aria-label="Карта доставок"></div>
      <div class="mapshade" id="mapShade" hidden></div>
      <div class="maphud">
        <div class="mapcap" id="mapCap"></div>
        <div class="maptools">
          <button type="button" id="mapFull">На весь экран</button>
          <button type="button" id="fitBtn">Все точки</button>
          <button type="button" id="rashadBtn">Рашад</button>
          <button type="button" id="mapClose" hidden>Закрыть</button>
        </div>
      </div>
    </div>
  </aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
<div id="order" class="order" hidden>
  <div class="order-bg" data-order-close></div>
  <section class="order-card" role="dialog" aria-modal="true" aria-labelledby="orderTitle">
    <div class="grab"></div>
    <div id="orderBody"></div>
  </section>
</div>
<div id="panel" class="panel" hidden>
  <div class="panel-bg" data-panel-close></div>
  <section class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="grab"></div>
    <header class="panel-h"><h2 id="panelTitle">Рашад</h2><button type="button" class="icon" data-panel-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="seg" id="panelSeg"></div>
    <div id="panelBody"></div>
  </section>
</div>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="fbs.js"></script>
<script src="days.js"></script>
<script src="prototype.js"></script>
</body>
</html>

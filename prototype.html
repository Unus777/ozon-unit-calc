<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>Алмалы · прототип</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="ribbon" id="ribbon" role="status">Прототип · в таблицу и Ozon ничего не отправляется</div>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">А</span>
    <div><strong>Алмалы</strong><span id="dayLine">Доставка</span></div>
  </div>
  <button type="button" class="who" id="whoBtn" aria-haspopup="dialog">
    <span class="ava" id="whoAva">Р</span>
    <span class="who-t"><b>Рашад</b><small id="whoSeen">нет данных</small></span>
  </button>
</header>
<div class="workspace">
  <div class="listcol">
    <div class="sticky">
      <div class="tabs" id="tabs" role="tablist" aria-label="Разделы заказов"></div>
      <form class="search" id="searchForm" role="search">
        <span class="lens" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input id="q" type="search" placeholder="ЦБ, адрес, имя, телефон" aria-label="Найти заказ" autocomplete="off" enterkeyhint="search">
        <button type="button" class="icon" id="reloadBtn" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></svg></button>
        <button type="button" class="icon mapbtn" id="mapBtn" aria-label="Открыть карту"><svg viewBox="0 0 24 24"><path d="M9 4.5l-5 2v13l5-2 6 2 5-2v-13l-5 2zM9 4.5v13M15 6.5v13"/></svg></button>
      </form>
    </div>
    <main id="stage" tabindex="-1"></main>
  </div>
  <aside class="mapcol" id="mapCol" aria-label="Карта">
    <div id="map" role="region" aria-label="Карта доставок: Рашад и точки заказов"></div>
    <div class="mapshade" id="mapShade" hidden></div>
    <div class="maphud">
      <div class="mapcap" id="mapCap"></div>
      <div class="maptools">
        <a id="routeLink" href="#" target="_blank" rel="noopener" hidden>Маршрут</a>
        <button type="button" id="fitBtn">Все точки</button>
        <button type="button" id="rashadBtn">Рашад</button>
        <button type="button" id="mapClose" hidden>Закрыть</button>
      </div>
    </div>
    <div class="mapstops" id="mapStops"></div>
  </aside>
</div>
<div id="panel" class="panel" hidden>
  <div class="panel-bg" data-panel-close></div>
  <section class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="grab" aria-hidden="true"></div>
    <header class="panel-h">
      <h2 id="panelTitle">Рашад</h2>
      <button type="button" class="icon" data-panel-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </header>
    <div class="seg" id="panelSeg" role="tablist"></div>
    <div id="panelBody"></div>
  </section>
</div>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="fbs.js"></script>
<script src="days.js"></script>
<script src="prototype.js"></script>
</body>
</html>
